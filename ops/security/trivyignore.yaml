# Findings of the container scan that are accepted for a time (DSA-001 section 8,
# MIL-022 task 1). Trivy leaves them out of the gate; scripts/scan-gate.sh
# --check-ignore refuses an entry without a statement or with an expiry more than
# 30 days ahead. An entry is added by a reviewed pull request; S01 approves it.
#
# Format (Trivy YAML ignore file):
#   vulnerabilities:
#     - id: CVE-2026-12345
#       paths: ["usr/lib/libexample.so"]   # optional, narrows the entry
#       statement: "Not reachable: the service never parses untrusted archives."
#       expired_at: 2026-11-19
#
# An entry without paths or purls applies to every image that the file scans, the release images
# of NF Hotel included. An entry for a third-party image therefore names its files (paths: the
# Target of a Go binary in the report, exact or with *) or its packages (purls: the package URL of
# an OS or a Python package, with or without its version), which Trivy 0.75.0 honours (MIL-065,
# checked on 2026-11-08). The statement begins with what the check found: "Not in the binary" (the
# affected package is not compiled into it), "Not used" (the file or the library never runs in the
# container) or "Accepted" (it runs, and the statement says why the risk is taken until the expiry).
# The daily scan reports a finding again once its entry has run out (MIL-036).
# Each statement stays on one line, which scan-gate.sh --check-ignore reads, so the line length
# of yamllint does not apply to this file. A statement with ": " in it is in double quotes, as
# YAML requires: Trivy cannot parse the file otherwise, and --check-ignore refuses it with the
# line number (MIL-066 task 5).
# yamllint disable rule:line-length
vulnerabilities:
