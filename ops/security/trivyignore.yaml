    statement: "Not in the binary: the finding is in the HTML parser golang.org/x/net/html (addText, fosterParent), which has no function in these binaries; they use other packages of golang.org/x/net, and Alloy has only the init function of html for html/charset (function names, 2026-11-08). No release of these images has x/net 0.62.0 yet."
