# Build the four NF Hotel images from an NF-Hotel/NFHotel checkout and, with push, push
# them to GHCR and write the release manifest (ADR-0007, ADR-0012 of NFHotel, MIL-025). With
# push it also writes migrations.sql, the idempotent migration script of the release, which
# the caller uploads with release.json (MIL-022 task 6).
# Called by release.yaml of NFHotel, pinned by full commit SHA; that job holds the
# permissions and the GHCR login. Every built image is scanned with Trivy before any
# push and the release stops on a blocking finding (MIL-022 task 1). Changes outside the
# repository only with push: 'true': the packages ghcr.io/nf-hotel/* and, for each
# built image, an SBOM and a build provenance attestation pushed beside it (MIL-022
# task 2), which needs packages: write, id-token: write and attestations: write. With
# upload-sarif: 'true' the scan results go to code scanning (security-events: write).
# The logic is in scripts/build-release-images.sh of this repository, at the same commit.
name: NF Hotel release images
description: Build the NF Hotel images from an NFHotel checkout and write the release manifest

inputs:
  app-path:
    description: Path of the NF-Hotel/NFHotel checkout in the workspace
    required: true
  app-sha:
    description: The NFHotel commit of the release (the checkout must be at it)
    required: true
  registry:
    description: Image prefix
    required: false
    default: ghcr.io/nf-hotel
  push:
    description: "'true' pushes the images and writes release.json; anything else only builds"
    required: false
    default: "false"
  devops-sha:
    description: The NF-Hotel/DevOps commit; only for its own CI, where the action is local
    required: false
    default: ""
  upload-sarif:
    description: "'true' uploads the Trivy results to code scanning (security-events: write)"
    required: false
    default: "false"

outputs:
  devops-sha:
    description: The NF-Hotel/DevOps commit the action ran at
    value: ${{ steps.devops.outputs.devops_sha }}

runs:
  using: composite
  steps:
    - name: Resolve the DevOps commit
      id: devops
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        DEVOPS_SHA_INPUT: ${{ inputs.devops-sha }}
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/action-ref.sh"

    # The migration script of a release is made with the SDK of the checkout (MIL-022 task 6).
    - name: Install the .NET SDK of the checkout
      if: inputs.push == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        global-json-file: ${{ inputs.app-path }}/global.json

    - name: Build and scan the images
      id: build
      shell: bash
      env:
        APP_PATH: ${{ inputs.app-path }}
        APP_SHA: ${{ inputs.app-sha }}
        REGISTRY: ${{ inputs.registry }}
        PUSH: ${{ inputs.push }}
        DEVOPS_SHA: ${{ steps.devops.outputs.devops_sha }}
        SCAN_DIR: ${{ github.workspace }}/release-scan
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/release-steps.sh"

    # One upload per image, each its own category, so the results of one image never
    # replace those of another. Also after a failed scan, so the findings are visible.
    - name: Upload the scan of nfhotel-web
      if: >-
        always() && inputs.upload-sarif == 'true' &&
        hashFiles('release-scan/nfhotel-web.sarif') != ''
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
      with:
        sarif_file: release-scan/nfhotel-web.sarif
        category: trivy-nfhotel-web
    - name: Upload the scan of nfhotel-api
      if: >-
        always() && inputs.upload-sarif == 'true' &&
        hashFiles('release-scan/nfhotel-api.sarif') != ''
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
      with:
        sarif_file: release-scan/nfhotel-api.sarif
        category: trivy-nfhotel-api
    - name: Upload the scan of market-analysis
      if: >-
        always() && inputs.upload-sarif == 'true' &&
        hashFiles('release-scan/market-analysis.sarif') != ''
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
      with:
        sarif_file: release-scan/market-analysis.sarif
        category: trivy-market-analysis
    - name: Upload the scan of benchmark
      if: >-
        always() && inputs.upload-sarif == 'true' &&
        hashFiles('release-scan/benchmark.sarif') != ''
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
      with:
        sarif_file: release-scan/benchmark.sarif
        category: trivy-benchmark

    # Only images built and pushed here get attestations; a frozen one has no digest output.
    - name: Attest the provenance of nfhotel-web
      if: inputs.push == 'true' && steps.build.outputs.nfhotel-web-digest != ''
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
      with:
        subject-name: ${{ inputs.registry }}/nfhotel-web
        subject-digest: ${{ steps.build.outputs.nfhotel-web-digest }}
        push-to-registry: true
        create-storage-record: false
    - name: Attest the SBOM of nfhotel-web
      if: inputs.push == 'true' && steps.build.outputs.nfhotel-web-digest != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
      with:
        subject-name: ${{ inputs.registry }}/nfhotel-web
        subject-digest: ${{ steps.build.outputs.nfhotel-web-digest }}
        sbom-path: release-scan/nfhotel-web.spdx.json
        push-to-registry: true
        create-storage-record: false
    - name: Attest the provenance of nfhotel-api
      if: inputs.push == 'true' && steps.build.outputs.nfhotel-api-digest != ''
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
      with:
        subject-name: ${{ inputs.registry }}/nfhotel-api
        subject-digest: ${{ steps.build.outputs.nfhotel-api-digest }}
        push-to-registry: true
        create-storage-record: false
    - name: Attest the SBOM of nfhotel-api
      if: inputs.push == 'true' && steps.build.outputs.nfhotel-api-digest != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
      with:
        subject-name: ${{ inputs.registry }}/nfhotel-api
        subject-digest: ${{ steps.build.outputs.nfhotel-api-digest }}
        sbom-path: release-scan/nfhotel-api.spdx.json
        push-to-registry: true
        create-storage-record: false
    - name: Attest the provenance of market-analysis
      if: inputs.push == 'true' && steps.build.outputs.market-analysis-digest != ''
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
      with:
        subject-name: ${{ inputs.registry }}/market-analysis
        subject-digest: ${{ steps.build.outputs.market-analysis-digest }}
        push-to-registry: true
        create-storage-record: false
    - name: Attest the SBOM of market-analysis
      if: inputs.push == 'true' && steps.build.outputs.market-analysis-digest != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
      with:
        subject-name: ${{ inputs.registry }}/market-analysis
        subject-digest: ${{ steps.build.outputs.market-analysis-digest }}
        sbom-path: release-scan/market-analysis.spdx.json
        push-to-registry: true
        create-storage-record: false
    - name: Attest the provenance of benchmark
      if: inputs.push == 'true' && steps.build.outputs.benchmark-digest != ''
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
      with:
        subject-name: ${{ inputs.registry }}/benchmark
        subject-digest: ${{ steps.build.outputs.benchmark-digest }}
        push-to-registry: true
        create-storage-record: false
    - name: Attest the SBOM of benchmark
      if: inputs.push == 'true' && steps.build.outputs.benchmark-digest != ''
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
      with:
        subject-name: ${{ inputs.registry }}/benchmark
        subject-digest: ${{ steps.build.outputs.benchmark-digest }}
        sbom-path: release-scan/benchmark.spdx.json
        push-to-registry: true
        create-storage-record: false
