# Dependabot version updates for NF-Hotel/DevOps (MIL-022 task 4). Every action is
# pinned by commit SHA and every image by digest; Dependabot proposes the next pin as a
# pull request, which goes through CI and review like any other change.
# A cooldown keeps a new release out for a week, so a compromised release has time to
# be found before it is proposed. The Python packages of the benchmark image are not
# here: requirements.lock is generated from the pinned commit of the benchmark
# repository and changes together with BENCHMARK_REF (see deploy/benchmark/Dockerfile).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/release-images
      - /.github/actions/deploy-release
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Actions:"

  - package-ecosystem: docker
    # Not deploy/market-analysis: that image is frozen and not built (ADR-0500).
    directories:
      - /deploy/benchmark
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Images:"

  - package-ecosystem: docker-compose
    directories:
      - /deploy/nginx
      - /deploy/ollama
      - /deploy/postgres
      - /deploy/proxmox
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A new major of PostgreSQL needs a dump and restore (ADR-0008), not a pull.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Images:"

  - package-ecosystem: nuget
    directories:
      - /tests/NFHotel.Proxmox.Tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: "NuGet:"
