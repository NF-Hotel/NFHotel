# NF Hotel VM (MIL-023, CIS-001 rows 1.5.x and 3.3.x of the Debian Benchmark): kernel and
# network settings. Installed by scripts/install-host-settings.sh as
# /etc/sysctl.d/60-nfhotel.conf and loaded at once and at every boot.
#
# Left at their values on purpose:
#   net.ipv4.ip_forward = 1     Docker routes its networks; the firewall chain docker-user
#                               filters what is forwarded (row 3.3.1)
#   net.ipv4.conf.*.rp_filter   loose (2), which Tailscale needs; strict (1) drops its replies
#   net.ipv6.conf.*.accept_ra   NetworkManager handles router advertisements itself and sets
#                               the interface to 0 already

# Address space randomisation, no ptrace of a process that is not a child, no core dump of a
# setuid program (1.5.x)
kernel.randomize_va_space = 2
kernel.yama.ptrace_scope = 1
fs.suid_dumpable = 0

# No ICMP redirects sent or accepted, no source routing (3.3.2 to 3.3.5)
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Log martian packets, ignore broadcast and bogus ICMP, SYN cookies on (3.3.6 to 3.3.10)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
net.ipv4.tcp_syncookies = 1
