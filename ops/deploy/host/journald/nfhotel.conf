# NF Hotel VM (MIL-023 task 4, CIS-001): keep the journal on disk, compressed, and bounded,
# so that logs survive a reboot and never fill the disk. A file is rotated at the latest
# after a month. Installed by scripts/install-patching.sh as
# /etc/systemd/journald.conf.d/nfhotel.conf.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=1G
SystemKeepFree=2G
MaxFileSec=1month
