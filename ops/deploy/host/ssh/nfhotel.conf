# NF Hotel VM (MIL-023, CIS-001 rows 5.1.x of the Debian Benchmark): the settings of sshd that
# Debian 13 does not set by itself. Installed by scripts/install-host-settings.sh as
# /etc/ssh/sshd_config.d/nfhotel.conf. sshd reads this file before the rest of
# /etc/ssh/sshd_config, and the first value of a setting wins.
#
# The administrators and CD log in by Tailscale SSH, which tailscaled serves itself on port 22
# of the tailnet address; the firewall drops port 22 on every other interface. This sshd is the
# fallback when Tailscale SSH is turned off, so it takes keys only and no root login. The way in
# when the network is down is the Proxmox console.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
HostbasedAuthentication no
IgnoreRhosts yes
PermitUserEnvironment no
MaxAuthTries 4
MaxSessions 10
MaxStartups 10:30:60
LoginGraceTime 60
ClientAliveInterval 15
ClientAliveCountMax 3
DisableForwarding yes
LogLevel VERBOSE
# The defaults of OpenSSH 10 without SHA-1 and the 64-bit MACs, which CIS counts as weak.
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256
KexAlgorithms mlkem768x25519-sha256,sntrup761x25519-sha512,sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521
