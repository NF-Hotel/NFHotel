# The socket proxy of NF Hotel (ADR-0042, MIL-081): HAProxy lets through to the Docker socket only
# the calls that Alloy makes to find the containers and read their logs, and refuses every other
# request with 403. It replaces the template of the upstream image (tecnativa/docker-socket-proxy),
# whose switches open a whole section of the Docker API each: CONTAINERS=1 also let through the
# archive, export and attach calls of every container. The entrypoint of the image still fills in
# ${BIND_CONFIG}; HAProxy reads LOG_LEVEL and SOCKET_PATH from the environment.
#
# The allowlist, measured from the requests of Alloy in ops/tests/test-alloy-start.sh, with or
# without an API version in front (/v1.NN):
#   GET or HEAD  /_ping
#   GET          /containers/json
#   GET          /networks
#   GET          /containers/<id>/json   (64 hexadecimal characters)
#   GET          /containers/<id>/logs
# A new version of Alloy that needs another call fails test-alloy-start.sh in CI before its
# update merges; the call then goes into this list and into ADR-0042.
global
    log stdout format raw daemon "${LOG_LEVEL}"

    pidfile /run/haproxy.pid
    maxconn 4000
    server-state-file /var/lib/haproxy/server-state

defaults
    mode http
    log global
    option httplog
    option dontlognull
    # Log a request when its answer starts: a log stream of Alloy stays open for as long as its
    # container runs, and would otherwise be logged only when it ends.
    option logasap
    option http-server-close
    option redispatch
    retries 3
    timeout http-request 10s
    timeout queue 1m
    timeout connect 10s
    timeout client 10m
    timeout server 10m
    timeout http-keep-alive 10s
    timeout check 10s
    maxconn 3000
    load-server-state-from-file global
    errorfile 400 /usr/local/etc/haproxy/errors/400.http
    errorfile 403 /usr/local/etc/haproxy/errors/403.http
    errorfile 408 /usr/local/etc/haproxy/errors/408.http
    errorfile 500 /usr/local/etc/haproxy/errors/500.http
    errorfile 502 /usr/local/etc/haproxy/errors/502.http
    errorfile 503 /usr/local/etc/haproxy/errors/503.http
    errorfile 504 /usr/local/etc/haproxy/errors/504.http

backend dockerbackend
    server dockersocket $SOCKET_PATH

frontend dockerfrontend
    bind ${BIND_CONFIG}
    # Reads only: METH_GET matches GET and HEAD.
    http-request deny unless METH_GET
    # No upgrade of the connection: attach over a WebSocket, or a hijacked stream, writes to a
    # container.
    http-request deny if { req.hdr(upgrade) -m found }
    http-request deny if { req.hdr(connection) -m sub -i upgrade }
    # The exact paths of the list. The path is matched as it arrives, not decoded, so an encoded
    # character (%2F among them), a dot segment or a trailing slash matches no entry and is refused.
    acl alloy_call path -m reg '^(/v1[.][0-9]+)?/(_ping|containers/json|networks|containers/[0-9a-f]{64}/(json|logs))$'
    http-request allow if alloy_call
    http-request deny
    default_backend dockerbackend
