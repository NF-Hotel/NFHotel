# The monitoring of NF Hotel (ADR-0020, MIL-023 task 7). It runs in the LXC container on the
# Proxmox node, not on nf-hotel, so it still reports when that VM is down. Start it there with
# scripts/deploy-monitoring.sh, which checks the settings and the configuration first.
#
#   Prometheus      metrics: probes of the site, and what Alloy on nf-hotel sends
#   Alertmanager    sends alerts to Discord, and the Watchdog to Healthchecks.io
#   Grafana         dashboards and logs, provisioned from grafana/
#   blackbox        probes the HTTPS pages, the redirect and the certificate over the tailnet
#   Loki            logs, sent by Alloy on nf-hotel
#
# Grafana, Prometheus and Loki are published on the tailnet address of the LXC only
# (MONITORING_BIND): Grafana for the team, Prometheus and Loki for Alloy on nf-hotel.
# CONFIG_HASH of each service is set by scripts/deploy-monitoring.sh to a hash of its
# configuration folder: the files are bind mounts, so without it a changed rule or route would
# never be read, as compose recreates a container only when its definition changes.
# Alertmanager and blackbox publish no port. Settings in monitoring.env and the secret
# files in secrets/ (both git-ignored); copy monitoring.env.example first.
name: nfhotel-monitoring

x-hardening: &hardening
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  pids_limit: 512

services:
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    environment:
      CONFIG_HASH: ${PROMETHEUS_CONFIG_HASH:-}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Alloy on nf-hotel pushes its metrics; Prometheus does not reach into the VM.
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "${MONITORING_BIND:?set it to the tailnet address of the LXC}:9090:9090"
    mem_limit: 1g
    cpus: 1

  alertmanager:
    <<: *hardening
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    environment:
      CONFIG_HASH: ${ALERTMANAGER_CONFIG_HASH:-}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      # discord-webhook-url and healthchecks-watchdog-url, one line each (git-ignored).
      - ./secrets:/etc/alertmanager-secrets:ro
      - alertmanager-data:/alertmanager
    mem_limit: 256m
    cpus: 0.5

  # The image has no USER and ran as root, which the runtime check of MIL-080 found; nobody is
  # enough, as every module of blackbox.yml probes over HTTP (an ICMP module would need NET_RAW).
  blackbox:
    <<: *hardening
    image: prom/blackbox-exporter:v0.29.1@sha256:ea1c7aa3ef3f307cd03e85f34abb604478ccb90b567fc690da0cd9776da76b13
    user: "65534:65534"
    environment:
      CONFIG_HASH: ${BLACKBOX_CONFIG_HASH:-}
    command: [--config.file=/etc/blackbox/blackbox.yml]
    volumes:
      - ./blackbox:/etc/blackbox:ro
    mem_limit: 128m
    cpus: 0.5

  loki:
    <<: *hardening
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    environment:
      CONFIG_HASH: ${LOKI_CONFIG_HASH:-}
    command: [-config.file=/etc/loki/config.yml]
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/loki
    tmpfs: [/tmp]
    ports:
      - "${MONITORING_BIND:?set it to the tailnet address of the LXC}:3100:3100"
    mem_limit: 1g
    cpus: 1

  grafana:
    <<: *hardening
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    environment:
      CONFIG_HASH: ${GRAFANA_CONFIG_HASH:-}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana-admin-password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./secrets/grafana-admin-password:/run/secrets/grafana-admin-password:ro
      - grafana-data:/var/lib/grafana
    tmpfs: [/tmp]
    # Grafana migrates its database at the first start, which takes a while; the health check
    # makes `up --wait` of deploy-monitoring.sh return only when it answers.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    ports:
      - "${MONITORING_BIND:?set it to the tailnet address of the LXC}:3000:3000"
    mem_limit: 512m
    cpus: 1

  # The results of the security scans of the pipeline (MIL-053): GitHub code scanning, the
  # latest run of each scan workflow and SonarQube Cloud, read every 15 minutes. Standard
  # library only, so the pinned image runs the mounted code and nothing is built. It runs as a
  # user of its own, which owns the optional token file; no port is published.
  scan-exporter:
    <<: *hardening
    image: python:3.13-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90
    user: "10001:10001"
    environment:
      CONFIG_HASH: ${SCAN_EXPORTER_CONFIG_HASH:-}
      GITHUB_TOKEN_FILE: /run/secrets/github-scan-token
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    command: [python, -B, -E, -s, /app/run.py]
    working_dir: /app
    volumes:
      - ./scan-exporter:/app:ro
      # deploy-monitoring.sh makes an empty file when there is no token, so compose never makes
      # a folder here; an empty file means code scanning is not read.
      - ./secrets/github-scan-token:/run/secrets/github-scan-token:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:9120/metrics', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: 0.25

volumes:
  prometheus-data:
  alertmanager-data:
  loki-data:
  grafana-data:
