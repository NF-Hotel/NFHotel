# Loki of NF Hotel (ADR-0020, MIL-023 task 7): one process, files on its volume, logs kept
# 14 days. Alloy on nf-hotel pushes the logs of its containers and of the systemd units.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-10-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 14d
  reject_old_samples: true
  reject_old_samples_max_age: 168h

# Alert rules on the logs (MIL-036 task 2): rules/fake/*.yml of this folder (fake is the tenant
# when auth is off), evaluated every minute and sent to the same Alertmanager as Prometheus.
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/ruler
  alertmanager_url: http://alertmanager:9093
  evaluation_interval: 1m
  enable_api: true
  ring:
    kvstore:
      store: inmemory

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
