# Alertmanager of NF Hotel (ADR-0020, MIL-023 task 9). Alerts go to the Discord channel
# #nf-hotel-alerts; the always-firing Watchdog goes every minute to Healthchecks.io, which
# alerts when it stops. The webhook URLs are secrets in files (secrets/, git-ignored), never in
# this file. Checked in CI with `amtool check-config`.
route:
  receiver: discord
  group_by: [alertname, instance, container, task]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # A repeat goes out only at a group_interval tick. With 1m and 1m the tick came just too
    # early, so the ping came every 2 minutes (Healthchecks.io, 2026-10-24); a 30 s tick and a
    # 50 s repeat send it every minute, which the check's period of 1 minute expects.
    - matchers: [alertname="Watchdog"]
      receiver: healthchecks
      group_wait: 0s
      group_interval: 30s
      repeat_interval: 50s

receivers:
  - name: discord
    discord_configs:
      - webhook_url_file: /etc/alertmanager-secrets/discord-webhook-url
        send_resolved: true

  - name: healthchecks
    webhook_configs:
      - url_file: /etc/alertmanager-secrets/healthchecks-watchdog-url
        send_resolved: false

# A critical alert of a container or the site silences the warnings of the same target.
inhibit_rules:
  - source_matchers: [alertname="SiteDown"]
    target_matchers: [alertname="RedirectBroken"]
  - source_matchers: [alertname="NoMetricsFromNfHotel"]
    target_matchers: [severity="warning"]
