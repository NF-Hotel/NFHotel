# Security alerts from the metrics (MIL-036 task 2). The API counts its answers per route and
# status (MIL-034), so failed staff sign-ins (401) and refused ones over the rate limit (429)
# are seen here; the audit table of ADR-0017 keeps who and when. Since MIL-087 it also counts
# the security events of the booking flow, and since MIL-088 its mails.
groups:
  - name: nfhotel-security
    rules:
      - alert: StaffSignInFailures
        expr: >-
          sum(increase(http_server_request_duration_seconds_count{host="nf-hotel",
          job="nfhotel-api", http_route="api/auth/login",
          http_response_status_code=~"401|429"}[10m])) > 20
        labels:
          severity: warning
          host: nf-hotel
        annotations:
          summary: "{{ $value | humanize }} failed or refused staff sign-ins in 10 minutes"
          description: >-
            Someone may be guessing passwords. The audit log of the back office names the user
            names (ADR-0017); follow the incident procedure (wiki page Incidents).

      # The security events of the booking flow (MIL-087, ADR-0051 decision 6): the API counts
      # each one in nfhotel_security_events_total with its kind, and a refusal with its limit. The
      # web application counts its refusals of the limit circuits there too (ADR-0051 decision 8).
      - alert: BookingFlowRefusals
        expr: >-
          sum(increase(nfhotel_security_events_total{host="nf-hotel",
          job=~"nfhotel-api|nfhotel-web", kind="limit_refused"}[10m])) > 20
        labels:
          severity: warning
          host: nf-hotel
        annotations:
          summary: >-
            {{ $value | humanize }} refusals by the limits of the booking flow in 10 minutes
          description: >-
            A sender asks the booking flow for more than its limits allow (ADR-0051). The
            events limit_refused in the logs of the API and the web application name the limit
            and the address; follow the wiki page Alerts, section Booking flow.

      - alert: PublicBookingSurge
        expr: >-
          sum(increase(nfhotel_security_events_total{host="nf-hotel", job="nfhotel-api",
          kind="public_booking_made"}[1h])) > 10
        labels:
          severity: warning
          host: nf-hotel
        annotations:
          summary: "{{ $value | humanize }} bookings on the public site in an hour"
          description: >-
            More bookings than usual came from the public site; one sender may hold rooms with
            many addresses and emails (ADR-0051). Follow the wiki page Alerts, section Booking
            flow.

      # The mail of the booking flow (MIL-088, ADR-0053 decisions 5 and 6): the API counts a mail
      # that the relay did not take as the event mail_not_sent, a request that the fuse refused as
      # mail_fuse_blown, and each mail it sent in nfhotel_mails_total with its kind
      # (verification_link or booking_receipt).
      - alert: MailNotSent
        expr: >-
          sum(increase(nfhotel_security_events_total{host="nf-hotel", job="nfhotel-api",
          kind="mail_not_sent"}[10m])) > 0
        labels:
          severity: critical
          host: nf-hotel
        annotations:
          summary: >-
            Mails of the booking flow not sent in 10 minutes: {{ printf "%.0f" $value }}
          description: >-
            The relay did not take a mail (ADR-0053 decision 5). With the verification by email
            on, the public booking refuses requests until mails go out again. The events
            mail_not_sent in the log of the API name the kind of the mail and the reason; follow
            the wiki page Alerts, section Mail.

      - alert: MailFuseBlown
        expr: >-
          sum(increase(nfhotel_security_events_total{host="nf-hotel", job="nfhotel-api",
          kind="mail_fuse_blown"}[10m])) > 0
        labels:
          severity: critical
          host: nf-hotel
        annotations:
          summary: >-
            Booking requests refused by the fuse of the mail in 10 minutes:
            {{ printf "%.0f" $value }}
          description: >-
            The mails of 24 hours reached Smtp__MaxMailsPerDay (400 by default, ADR-0053 decision
            6), so the public booking refuses new requests until the count falls. Someone may be
            making the hotel send mail; follow the wiki page Alerts, section Mail.

      - alert: MailVolumeHigh
        expr: >-
          sum(increase(nfhotel_mails_total{host="nf-hotel", job="nfhotel-api"}[24h])) >= 200
        labels:
          severity: warning
          host: nf-hotel
        annotations:
          summary: "{{ $value | humanize }} mails sent in 24 hours"
          description: >-
            More mails than usual went out (ADR-0053 decision 6). At 400 in 24 hours the fuse
            pauses the public booking, and Gmail allows the account 500 a day. Follow the wiki
            page Alerts, section Mail.

      # The runtime check of MIL-080 (nfhotel-container-check.timer, every 15 minutes) reports one
      # series for each rule that a running container on nf-hotel breaks.
      - alert: ContainerRuntimeViolation
        expr: nfhotel_container_runtime_violation{host="nf-hotel"} == 1
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.container }} on nf-hotel breaks its profile: {{ $labels.rule }}"
          description: >-
            The container runs with more rights than its row in
            ops/security/container-profiles.tsv allows. Read the check on nf-hotel (sudo
            journalctl -u nfhotel-container-check) and follow the wiki page Host-Hardening.

      # The floor of runc in the same check (MIL-083, ADR-0043): the runc of nf-hotel is older than
      # the first version of its line without the known container escapes.
      - alert: ContainerRuntimeKnownEscape
        expr: nfhotel_container_runtime_runc_below_floor{host="nf-hotel"} == 1
        labels:
          severity: critical
        annotations:
          summary: "runc on nf-hotel is older than the fix of a known container escape"
          description: >-
            The runtime check found a runc below the floor in
            ops/scripts/check-container-runtime.sh; nfhotel_container_runtime_info has its
            version. Install the fixed runc from Docker's repository as the wiki page
            Container-Escape says.

      - alert: ContainerCheckStale
        expr: >-
          time() - nfhotel_task_last_success_timestamp_seconds{host="nf-hotel",
          task="container_check"} > 45 * 60
        labels:
          severity: warning
        annotations:
          summary: "The runtime check of the containers on nf-hotel has not run for 45 minutes"
          description: >-
            nfhotel-container-check.timer did not run, Docker did not answer, or a deploy held
            the lock at each run. Check the timer and its journal on nf-hotel (wiki page
            Host-Hardening).
