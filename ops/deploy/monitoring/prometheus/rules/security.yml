# Security alerts from the metrics (MIL-036 task 2). The API counts its answers per route and
# status (MIL-034), so failed staff sign-ins (401) and refused ones over the rate limit (429)
# are seen here; the audit table of ADR-0017 keeps who and when.
groups:
  - name: nfhotel-security
    rules:
      - alert: StaffSignInFailures
        expr: >-
          sum(increase(http_server_request_duration_seconds_count{host="nf-hotel",
          job="nfhotel-api", http_route="api/auth/login",
          http_response_status_code=~"401|429"}[10m])) > 20
        labels:
          severity: warning
          host: nf-hotel
        annotations:
          summary: "{{ $value | humanize }} failed or refused staff sign-ins in 10 minutes"
          description: >-
            Someone may be guessing passwords. The audit log of the back office names the user
            names (ADR-0017); follow the incident procedure (wiki page Incidents).

      # The runtime check of MIL-080 (nfhotel-container-check.timer, every 15 minutes) reports one
      # series for each rule that a running container on nf-hotel breaks.
      - alert: ContainerRuntimeViolation
        expr: nfhotel_container_runtime_violation{host="nf-hotel"} == 1
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.container }} on nf-hotel breaks its profile: {{ $labels.rule }}"
          description: >-
            The container runs with more rights than its row in
            ops/security/container-profiles.tsv allows. Read the check on nf-hotel (sudo
            journalctl -u nfhotel-container-check) and follow the wiki page Host-Hardening.

      # The floor of runc in the same check (MIL-083, ADR-0043): the runc of nf-hotel is older than
      # the first version of its line without the known container escapes.
      - alert: ContainerRuntimeKnownEscape
        expr: nfhotel_container_runtime_runc_below_floor{host="nf-hotel"} == 1
        labels:
          severity: critical
        annotations:
          summary: "runc on nf-hotel is older than the fix of a known container escape"
          description: >-
            The runtime check found a runc below the floor in
            ops/scripts/check-container-runtime.sh; nfhotel_container_runtime_info has its
            version. Install the fixed runc from Docker's repository as the wiki page
            Container-Escape says.

      - alert: ContainerCheckStale
        expr: >-
          time() - nfhotel_task_last_success_timestamp_seconds{host="nf-hotel",
          task="container_check"} > 45 * 60
        labels:
          severity: warning
        annotations:
          summary: "The runtime check of the containers on nf-hotel has not run for 45 minutes"
          description: >-
            nfhotel-container-check.timer did not run, Docker did not answer, or a deploy held
            the lock at each run. Check the timer and its journal on nf-hotel (wiki page
            Host-Hardening).
