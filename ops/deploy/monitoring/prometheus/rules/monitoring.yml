# Alerts on the pull deploy of the monitoring (ADR-0044, MIL-051). The pull writes its report on
# the LXC every 2 minutes and the scan exporter serves it (job scans), so a value is at most a
# few minutes old. A failure needs no wait: the head that failed is not tried again.
groups:
  - name: nfhotel-monitoring-deploy
    rules:
      - alert: MonitoringDeployFailed
        expr: nfhotel_monitoring_deploy_failed == 1
        labels:
          severity: warning
        annotations:
          summary: "The monitoring deploy of {{ $labels.commit }} failed at {{ $labels.stage }}"
          description: >-
            The monitoring host runs the commit it ran before (after stage rollback, maybe
            nothing). Read why in its journal: journalctl -u nfhotel-monitoring-pull --since -1h.
            The same head is not tried again: merge a fix, or fix the host and remove
            /var/lib/nfhotel-monitoring/failed (wiki page Monitoring).

      - alert: MonitoringDeployBehind
        expr: >-
          time() - nfhotel_monitoring_deploy_waiting_since_timestamp_seconds > 30 * 60
          unless on() nfhotel_monitoring_deploy_failed == 1
        labels:
          severity: warning
        annotations:
          summary: "A merged change of the monitoring has waited 30 minutes to be deployed"
          description: >-
            The Ops CI run of the push of the head of main has not passed, or the pull does not
            deploy. Check that run in GitHub Actions and the journal on the monitoring host:
            journalctl -u nfhotel-monitoring-pull --since -1h.

      - alert: MonitoringDeployStale
        expr: >-
          time() - nfhotel_task_last_success_timestamp_seconds{task="monitoring_pull"} > 3600
        labels:
          severity: warning
        annotations:
          summary: "The pull deploy of the monitoring has not read main for an hour"
          description: >-
            nfhotel-monitoring-pull.timer does not run, or the monitoring host cannot reach
            GitHub. Check systemctl status nfhotel-monitoring-pull.timer and the journal of the
            service.

      # The scan exporter serves the report; when the exporter is down, ScanSourceDown says so.
      - alert: MonitoringDeployReportMissing
        expr: >-
          absent(nfhotel_task_last_success_timestamp_seconds{task="monitoring_pull"})
          and on() up{job="scans"} == 1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The monitoring host reports no pull deploy"
          description: >-
            The timer of the pull is not installed, or its report in
            /var/lib/nfhotel-monitoring/metrics is missing or left out (the log of the scan
            exporter says why). Install it with pull-monitoring.sh --install (wiki page
            Monitoring).
