# Unit tests of the alert rules (MIL-023 task 9), run in CI with
# `promtool test rules rules-test.yml` from the prometheus folder.
rule_files:
  - rules/nfhotel.yml
  - rules/applications.yml
  - rules/security.yml
  - rules/scans.yml
  - rules/monitoring.yml

evaluation_interval: 30s

tests:
  - name: the site down for 2 minutes fires SiteDown
    interval: 30s
    input_series:
      - series: 'probe_success{job="site", instance="https://nf-hotel.taildb84b5.ts.net/"}'
        values: "1 1 0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 1m
        alertname: SiteDown
        exp_alerts: []
      - eval_time: 3m30s
        alertname: SiteDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: site
              instance: https://nf-hotel.taildb84b5.ts.net/
            exp_annotations:
              summary: "https://nf-hotel.taildb84b5.ts.net/ does not answer over HTTPS"
              description: >-
                The probe of https://nf-hotel.taildb84b5.ts.net/ has failed for 2 minutes. Runbook:
                wiki page CI-CD, When a deploy does not start, and Host-Hardening.

  - name: the public site down after it had answered fires PublicSiteDown
    interval: 1m
    input_series:
      - series: 'probe_success{job="public_site", instance="https://nfhotel.devmatiker.com/"}'
        values: "1 1 1 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 4m
        alertname: PublicSiteDown
        exp_alerts: []
      - eval_time: 7m
        alertname: PublicSiteDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: public_site
              instance: https://nfhotel.devmatiker.com/
            exp_annotations:
              summary: "https://nfhotel.devmatiker.com/ does not answer from the internet"
              description: >-
                The public probe of https://nfhotel.devmatiker.com/ has failed for 3 minutes, so
                guests cannot reach the site. Runbook: wiki page Public-Access, When the public
                site is down.

  - name: a public site that never answered (no tunnel yet) does not fire PublicSiteDown
    interval: 1m
    input_series:
      - series: 'probe_success{job="public_site", instance="https://nfhotel.devmatiker.com/"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: PublicSiteDown
        exp_alerts: []

  - name: a certificate with 20 days left fires CertificateExpiresSoon once for all its pages
    interval: 1m
    input_series:
      - series: >-
          probe_ssl_earliest_cert_expiry{job="site", instance="https://nf-hotel.taildb84b5.ts.net/"}
        values: "1728000x20"
      - series: >-
          probe_ssl_earliest_cert_expiry{job="site",
          instance="https://nf-hotel.taildb84b5.ts.net/book"}
        values: "1728000x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: CertificateExpiresSoon
        exp_alerts:
          - exp_labels:
              severity: warning
              job: site
            exp_annotations:
              summary: "The certificate of nf-hotel expires in 19.99 days"
              description: >-
                The renewal (nfhotel-cert-renew.timer, ADR-0009) has not replaced it. Check its
                journal on nf-hotel.

  - name: a backup report older than 26 hours fires BackupStale, a fresh one does not
    interval: 1h
    input_series:
      - series: 'nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="backup"}'
        values: "0x30"
      - series: 'nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="offvm_copy"}'
        values: "0+3600x30"
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupStale
        exp_alerts: []
      - eval_time: 27h
        alertname: BackupStale
        exp_alerts:
          - exp_labels:
              severity: critical
              host: nf-hotel
              task: backup
            exp_annotations:
              summary: "The last database backup is older than 26 hours"
              description: "Check nfhotel-backup.timer and its journal on nf-hotel (ADR-0008)."
      - eval_time: 27h
        alertname: OffVmCopyStale
        exp_alerts: []

  - name: a backup host that answers more than 2 hours after the last copy fires BackupTargetDown
    interval: 1h
    input_series:
      - series: 'nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="offvm_copy"}'
        values: "0x10"
      - series: >-
          nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="backup_host_seen"}
        values: "0+3600x10"
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupTargetDown
        exp_alerts: []
      - eval_time: 3h
        alertname: BackupTargetDown
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-hotel
            exp_annotations:
              summary: "The backup host is on, but no copy has reached its target for over 2 hours"
              description: >-
                Docker Desktop or the backup target on the backup host is down. Start them (wiki
                page Disaster-Recovery); the next hourly copy sends what the target lacks.

  - name: a backup host that has not answered since the last copy keeps BackupTargetDown silent
    interval: 1h
    input_series:
      - series: 'nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="offvm_copy"}'
        values: "0x30"
      - series: >-
          nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="backup_host_seen"}
        values: "0x30"
    alert_rule_test:
      - eval_time: 27h
        alertname: BackupTargetDown
        exp_alerts: []

  - name: a backup newer than its read-back fires BackupUnreadable
    interval: 1h
    input_series:
      - series: 'nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="backup"}'
        values: "3600x3 90000x3"
      - series: >-
          nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="backup_check"}
        values: "3600x7"
    alert_rule_test:
      - eval_time: 2h
        alertname: BackupUnreadable
        exp_alerts: []
      - eval_time: 5h
        alertname: BackupUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-hotel
            exp_annotations:
              summary: "The newest database backup could not be read back"
              description: >-
                pg_restore did not read the dump of the newest backup to its end; the journal
                of nfhotel-backup on nf-hotel names the error. Run the backup again, and the
                restore drill if the next one fails too (wiki page Disaster-Recovery).

  - name: a backup read back every night keeps BackupUnreadable silent
    interval: 1h
    input_series:
      - series: 'nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="backup"}'
        values: "3600x3 90000x3"
      - series: >-
          nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="backup_check"}
        values: "3600x3 90000x3"
    alert_rule_test:
      - eval_time: 5h
        alertname: BackupUnreadable
        exp_alerts: []

  - name: backup_check 0 (no dump read back yet) fires BackupUnreadable, no report at all does not
    interval: 1h
    input_series:
      - series: 'nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="backup"}'
        values: "3600x3"
      - series: >-
          nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="backup_check"}
        values: "0x3"
      - series: 'nfhotel_task_last_success_timestamp_seconds{host="other", task="backup"}'
        values: "3600x3"
    alert_rule_test:
      - eval_time: 1h
        alertname: BackupUnreadable
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-hotel
            exp_annotations:
              summary: "The newest database backup could not be read back"
              description: >-
                pg_restore did not read the dump of the newest backup to its end; the journal
                of nfhotel-backup on nf-hotel names the error. Run the backup again, and the
                restore drill if the next one fails too (wiki page Disaster-Recovery).

  - name: a dump with fewer tables than the most of 8 days fires BackupShrunk until 8 days pass
    interval: 1h
    input_series:
      - series: 'nfhotel_backup_tables{host="nf-hotel"}'
        values: "16x24 15x200"
      - series: 'nfhotel_backup_bytes{host="nf-hotel"}'
        values: "1000000x224"
    alert_rule_test:
      - eval_time: 24h
        alertname: BackupShrunk
        exp_alerts: []
      - eval_time: 30h
        alertname: BackupShrunk
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-hotel
            exp_annotations:
              summary: "The newest database backup is smaller than the backups of the last 8 days"
              description: >-
                It has fewer tables than the most of the last 8 days, or less than half the size
                of the largest. A migration that removed a table explains the first, and it
                stays for 8 days; otherwise check the database and its backups (wiki page
                Disaster-Recovery).
      - eval_time: 218h
        alertname: BackupShrunk
        exp_alerts: []

  - name: a dump under half the size of the largest of 8 days fires BackupShrunk, over half not
    interval: 1h
    input_series:
      - series: 'nfhotel_backup_tables{host="nf-hotel"}'
        values: "15x60"
      - series: 'nfhotel_backup_bytes{host="nf-hotel"}'
        values: "1000000x20 600000x20 400000x20"
    alert_rule_test:
      - eval_time: 30h
        alertname: BackupShrunk
        exp_alerts: []
      - eval_time: 50h
        alertname: BackupShrunk
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-hotel
            exp_annotations:
              summary: "The newest database backup is smaller than the backups of the last 8 days"
              description: >-
                It has fewer tables than the most of the last 8 days, or less than half the size
                of the largest. A migration that removed a table explains the first, and it
                stays for 8 days; otherwise check the database and its backups (wiki page
                Disaster-Recovery).

  - name: a dump that grows keeps BackupShrunk silent
    interval: 1h
    input_series:
      - series: 'nfhotel_backup_tables{host="nf-hotel"}'
        values: "15x20 16x20"
      - series: 'nfhotel_backup_bytes{host="nf-hotel"}'
        values: "1000000+10000x40"
    alert_rule_test:
      - eval_time: 39h
        alertname: BackupShrunk
        exp_alerts: []

  - name: a missing report fires TaskReportMissing and HealthReportMissing, while nf-hotel sends
    interval: 1m
    input_series:
      - series: 'node_uname_info{host="nf-hotel"}'
        values: "1x60"
      - series: 'nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="backup"}'
        values: "0x60"
      - series: 'nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="offvm_copy"}'
        values: "0x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: TaskReportMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-hotel
              task: cert_renew
            exp_annotations:
              summary: "nf-hotel has no cert_renew report"
              description: >-
                The job has not succeeded since /var/lib/nfhotel-metrics was made, or its report was
                removed. Check its timer and journal on nf-hotel (wiki page Monitoring).
          - exp_labels:
              severity: warning
              host: nf-hotel
              task: container_check
            exp_annotations:
              summary: "nf-hotel has no container_check report"
              description: >-
                The job has not succeeded since /var/lib/nfhotel-metrics was made, or its report was
                removed. Check its timer and journal on nf-hotel (wiki page Monitoring).
      - eval_time: 40m
        alertname: HealthReportMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-hotel
            exp_annotations:
              summary: "nf-hotel reports no container health"
              description: >-
                Check nfhotel-report-health.timer on nf-hotel: systemctl status
                nfhotel-report-health.timer

  - name: a VM that sends nothing raises no missing-report alert
    interval: 1m
    input_series:
      - series: 'node_uname_info{host="other"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: TaskReportMissing
        exp_alerts: []
      - eval_time: 40m
        alertname: HealthReportMissing
        exp_alerts: []

  - name: an unhealthy container fires ContainerUnhealthy
    interval: 1m
    input_series:
      - series: 'nfhotel_container_healthy{host="nf-hotel", container="nfhotel-web-nfhotel-web-1"}'
        values: "1 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 5m
        alertname: ContainerUnhealthy
        exp_alerts:
          - exp_labels:
              severity: critical
              host: nf-hotel
              container: nfhotel-web-nfhotel-web-1
            exp_annotations:
              summary: "nfhotel-web-nfhotel-web-1 on nf-hotel is not healthy"
              description: "Read its log: sudo docker logs --tail 50 nfhotel-web-nfhotel-web-1"

  - name: no metrics from nf-hotel fires NoMetricsFromNfHotel
    interval: 1m
    input_series:
      - series: 'node_uname_info{host="other"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: NoMetricsFromNfHotel
        exp_alerts:
          - exp_labels:
              severity: critical
              host: nf-hotel
            exp_annotations:
              summary: "No metrics from nf-hotel for 10 minutes"
              description: >-
                Alloy on nf-hotel sends nothing: the VM, Alloy or the tailnet path to the monitoring
                is down.

  - name: requests slower than 1 second at the 95th percentile fire ApplicationSlow
    interval: 1m
    input_series:
      - series: >-
          http_server_request_duration_seconds_bucket{host="nf-hotel", job="nfhotel-web",
          http_route="/book", le="0.5"}
        values: "0+1x30"
      - series: >-
          http_server_request_duration_seconds_bucket{host="nf-hotel", job="nfhotel-web",
          http_route="/book", le="1"}
        values: "0+1x30"
      - series: >-
          http_server_request_duration_seconds_bucket{host="nf-hotel", job="nfhotel-web",
          http_route="/book", le="2.5"}
        values: "0+10x30"
      - series: >-
          http_server_request_duration_seconds_bucket{host="nf-hotel", job="nfhotel-web",
          http_route="/book", le="+Inf"}
        values: "0+10x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ApplicationSlow
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-hotel
              job: nfhotel-web
            exp_annotations:
              summary: "nfhotel-web answers slowly: 95 % of the requests take up to 2.417s"
              description: >-
                The objective is 1 second. Open the dashboard for the routes, and the logs of the
                application in Grafana (wiki page Monitoring, runbook).

  - name: a long Blazor circuit is not counted as a slow request
    interval: 1m
    input_series:
      - series: >-
          http_server_request_duration_seconds_bucket{host="nf-hotel", job="nfhotel-web",
          http_route="/book", le="0.5"}
        values: "0+10x30"
      - series: >-
          http_server_request_duration_seconds_bucket{host="nf-hotel", job="nfhotel-web",
          http_route="/book", le="+Inf"}
        values: "0+10x30"
      - series: >-
          http_server_request_duration_seconds_bucket{host="nf-hotel", job="nfhotel-web",
          http_route="/_blazor", le="0.5"}
        values: "0+0x30"
      - series: >-
          http_server_request_duration_seconds_bucket{host="nf-hotel", job="nfhotel-web",
          http_route="/_blazor", le="+Inf"}
        values: "0+10x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ApplicationSlow
        exp_alerts: []

  - name: more than 5 % server errors with real traffic fire ApplicationErrors
    interval: 1m
    input_series:
      - series: >-
          http_server_request_duration_seconds_count{host="nf-hotel", job="nfhotel-web",
          http_response_status_code="200"}
        values: "0+10x30"
      - series: >-
          http_server_request_duration_seconds_count{host="nf-hotel", job="nfhotel-web",
          http_response_status_code="500"}
        values: "0+2x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ApplicationErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              host: nf-hotel
              job: nfhotel-web
            exp_annotations:
              summary: "nfhotel-web answers 16.67% of its requests with a server error"
              description: >-
                Read its log in Grafana: {container=~".*nfhotel-web.*"} |= "fail"

  - name: one server error at night is not an error rate
    interval: 1m
    input_series:
      - series: >-
          http_server_request_duration_seconds_count{host="nf-hotel", job="nfhotel-web",
          http_response_status_code="500"}
        values: "0+0.05x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: ApplicationErrors
        exp_alerts: []

  - name: more than 5 unhandled exceptions in 10 minutes fire ApplicationExceptions
    interval: 1m
    input_series:
      - series: >-
          aspnetcore_diagnostics_exceptions_total{host="nf-hotel", job="nfhotel-api",
          error_type="System.InvalidOperationException"}
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ApplicationExceptions
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-hotel
              job: nfhotel-api
            exp_annotations:
              summary: "nfhotel-api had 10 unhandled exceptions in 10 minutes"
              description: >-
                The type is the label error_type of aspnetcore_diagnostics_exceptions_total; the
                stack trace is in the log of the application in Grafana.

  - name: no request metrics while nf-hotel sends host metrics fire ApplicationMetricsMissing
    interval: 1m
    input_series:
      - series: 'node_uname_info{host="nf-hotel"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ApplicationMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-hotel
              job: nfhotel-web
            exp_annotations:
              summary: "nf-hotel sends no request metrics of the web application"
              description: >-
                Check Telemetry__OtlpEndpoint of nfhotel-web, and that Alloy is on the network
                nfhotel-api (sudo docker logs nfhotel-alloy-alloy-1).

  - name: the Watchdog always fires
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 1m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: none
            exp_annotations:
              summary: "The monitoring is alive"

  - name: many failed staff sign-ins fire StaffSignInFailures
    interval: 1m
    input_series:
      - series: >-
          http_server_request_duration_seconds_count{host="nf-hotel", job="nfhotel-api",
          http_route="api/auth/login", http_response_status_code="401"}
        values: "0+3x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: StaffSignInFailures
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-hotel
            exp_annotations:
              summary: "30 failed or refused staff sign-ins in 10 minutes"
              description: >-
                Someone may be guessing passwords. The audit log of the back office names the user
                names (ADR-0017); follow the incident procedure (wiki page Incidents).

  - name: a few failed sign-ins are not an attack
    interval: 1m
    input_series:
      - series: >-
          http_server_request_duration_seconds_count{host="nf-hotel", job="nfhotel-api",
          http_route="api/auth/login", http_response_status_code="401"}
        values: "0+0.2x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: StaffSignInFailures
        exp_alerts: []

  # The scan rules (MIL-053).
  - name: open high findings of a tool fire ScanFindingsHigh after 30 minutes
    interval: 5m
    input_series:
      - series: >-
          nfhotel_code_scanning_open_alerts{tool="Trivy", category="trivy-nfhotel-web",
          severity="high"}
        values: "2x20"
      - series: >-
          nfhotel_code_scanning_open_alerts{tool="Trivy", category="trivy-nfhotel-web",
          severity="low"}
        values: "5x20"
    alert_rule_test:
      - eval_time: 20m
        alertname: ScanFindingsHigh
        exp_alerts: []
      - eval_time: 40m
        alertname: ScanFindingsHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              tool: Trivy
            exp_annotations:
              summary: "2 open critical or high findings of Trivy"
              description: >-
                GitHub code scanning has open findings of high severity. Open Security, Code
                scanning of NF-Hotel/NFHotel, fix or dismiss each with a reason (wiki page Alerts).

  - name: low findings only do not fire ScanFindingsHigh
    interval: 5m
    input_series:
      - series: >-
          nfhotel_code_scanning_open_alerts{tool="CodeQL", category="/language:csharp",
          severity="low"}
        values: "3x20"
    alert_rule_test:
      - eval_time: 90m
        alertname: ScanFindingsHigh
        exp_alerts: []

  - name: a weekly scan 9 days old fires ScanStale, a fresh one does not
    interval: 1m
    input_series:
      - series: >-
          nfhotel_code_scanning_last_analysis_timestamp_seconds{tool="OWASP ZAP",
          category="zap-baseline-public"}
        values: "0x13000"
      - series: >-
          nfhotel_code_scanning_last_analysis_timestamp_seconds{tool="CodeQL",
          category="/language:csharp"}
        values: "0+60x13000"
      - series: >-
          nfhotel_code_scanning_last_analysis_timestamp_seconds{tool="Trivy",
          category="trivy-nfhotel-web"}
        values: "0x13000"
    alert_rule_test:
      - eval_time: 7d
        alertname: ScanStale
        exp_alerts: []
      - eval_time: 9d
        alertname: ScanStale
        exp_alerts:
          - exp_labels:
              severity: warning
              tool: OWASP ZAP
              category: zap-baseline-public
            exp_annotations:
              summary: "OWASP ZAP (zap-baseline-public) has not scanned for 8 days"
              description: >-
                These scans run at least weekly. Check the latest run of its workflow in GitHub
                Actions and whether the schedule is disabled.

  - name: a failed scan workflow fires ScanWorkflowFailed, a successful one does not
    interval: 5m
    input_series:
      - series: >-
          nfhotel_scan_workflow_last_run_info{workflow="e2e-dast.yaml",
          conclusion="failure"}
        values: "1x20"
      - series: 'nfhotel_scan_workflow_last_run_info{workflow="ci.yaml", conclusion="success"}'
        values: "1x20"
    alert_rule_test:
      - eval_time: 40m
        alertname: ScanWorkflowFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              workflow: e2e-dast.yaml
              conclusion: failure
            exp_annotations:
              summary: "The latest run of e2e-dast.yaml on main ended with failure"
              description: >-
                A scan that fails gives no result, so its findings are unknown. Open the run in
                GitHub Actions and fix the cause or run it again.

  - name: a failing quality gate fires SonarQualityGateFailed after an hour
    interval: 1m
    input_series:
      - series: nfhotel_sonar_quality_gate_passed
        values: "1x30 0x120"
    alert_rule_test:
      - eval_time: 60m
        alertname: SonarQualityGateFailed
        exp_alerts: []
      - eval_time: 2h
        alertname: SonarQualityGateFailed
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The SonarQube Cloud quality gate of NF Hotel fails"
              description: >-
                The new code of main does not meet the quality gate. Open the project on
                sonarcloud.io to see which condition fails.

  - name: a source that cannot be read fires ScanSourceDown, a read one does not
    interval: 1m
    input_series:
      - series: 'up{job="scans", instance="scan-exporter:9120"}'
        values: "1x120"
      - series: 'nfhotel_scan_source_up{source="github_code_scanning"}'
        values: "0x120"
      - series: 'nfhotel_scan_source_up{source="sonarcloud"}'
        values: "1x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: ScanSourceDown
        exp_alerts:
          - exp_labels:
              severity: warning
              source: github_code_scanning
            exp_annotations:
              summary: "The scan exporter cannot read github_code_scanning"
              description: >-
                The panels of the dashboard Security scans are stale. Run `docker compose logs
                scan-exporter` in the monitoring LXC; a missing or expired token in
                secrets/github-scan-token stops github_code_scanning (wiki page Monitoring).

  - name: an exporter that is not scraped fires ScanSourceDown
    interval: 1m
    input_series:
      - series: 'up{job="scans", instance="scan-exporter:9120"}'
        values: "0x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: ScanSourceDown
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "The scan exporter cannot read any source"
              description: >-
                The panels of the dashboard Security scans are stale. Run `docker compose logs
                scan-exporter` in the monitoring LXC; a missing or expired token in
                secrets/github-scan-token stops github_code_scanning (wiki page Monitoring).

  # The runtime check of MIL-080.
  - name: a container that breaks its profile fires ContainerRuntimeViolation at once
    interval: 1m
    input_series:
      - series: >-
          nfhotel_container_runtime_violation{host="nf-hotel",
          container="nfhotel-web-nfhotel-web-1", rule="privileged"}
        values: "1x5"
    alert_rule_test:
      - eval_time: 1m
        alertname: ContainerRuntimeViolation
        exp_alerts:
          - exp_labels:
              severity: critical
              host: nf-hotel
              container: nfhotel-web-nfhotel-web-1
              rule: privileged
            exp_annotations:
              summary: "nfhotel-web-nfhotel-web-1 on nf-hotel breaks its profile: privileged"
              description: >-
                The container runs with more rights than its row in
                ops/security/container-profiles.tsv allows. Read the check on nf-hotel (sudo
                journalctl -u nfhotel-container-check) and follow the wiki page Host-Hardening.

  # The floor of runc (MIL-083): below it on nf-hotel fires at once; at or above it, or on
  # another host, does not.
  - name: a runc below its floor on nf-hotel fires ContainerRuntimeKnownEscape at once
    interval: 1m
    input_series:
      - series: nfhotel_container_runtime_runc_below_floor{host="nf-hotel"}
        values: "0 0 1 1"
      - series: nfhotel_container_runtime_runc_below_floor{host="other"}
        values: "1x3"
    alert_rule_test:
      - eval_time: 1m
        alertname: ContainerRuntimeKnownEscape
        exp_alerts: []
      - eval_time: 2m
        alertname: ContainerRuntimeKnownEscape
        exp_alerts:
          - exp_labels:
              severity: critical
              host: nf-hotel
            exp_annotations:
              summary: "runc on nf-hotel is older than the fix of a known container escape"
              description: >-
                The runtime check found a runc below the floor in
                ops/scripts/check-container-runtime.sh; nfhotel_container_runtime_info has its
                version. Install the fixed runc from Docker's repository as the wiki page
                Container-Escape says.

  - name: a check older than 45 minutes fires ContainerCheckStale, one each 15 minutes does not
    interval: 15m
    input_series:
      - series: >-
          nfhotel_task_last_success_timestamp_seconds{host="nf-hotel", task="container_check"}
        values: "0x8"
      - series: >-
          nfhotel_task_last_success_timestamp_seconds{host="other", task="container_check"}
        values: "0+900x8"
    alert_rule_test:
      - eval_time: 30m
        alertname: ContainerCheckStale
        exp_alerts: []
      - eval_time: 60m
        alertname: ContainerCheckStale
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-hotel
              task: container_check
            exp_annotations:
              summary: "The runtime check of the containers on nf-hotel has not run for 45 minutes"
              description: >-
                nfhotel-container-check.timer did not run, Docker did not answer, or a deploy held
                the lock at each run. Check the timer and its journal on nf-hotel (wiki page
                Host-Hardening).

  # The pull deploy of the monitoring (ADR-0044, MIL-051). The scan exporter serves its report,
  # so its series carry the job scans.
  - name: a failed monitoring deploy fires MonitoringDeployFailed at once, a good one does not
    interval: 1m
    input_series:
      - series: >-
          nfhotel_monitoring_deploy_failed{host="nf-monitoring", job="scans",
          instance="scan-exporter:9120"}
        values: "0 0 _ _"
      - series: >-
          nfhotel_monitoring_deploy_failed{host="nf-monitoring", job="scans",
          instance="scan-exporter:9120", commit="0123456789ab", stage="checks"}
        values: "_ _ 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: MonitoringDeployFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: MonitoringDeployFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-monitoring
              job: scans
              instance: scan-exporter:9120
              commit: 0123456789ab
              stage: checks
            exp_annotations:
              summary: "The monitoring deploy of 0123456789ab failed at checks"
              description: >-
                The monitoring host runs the commit it ran before (after stage rollback, maybe
                nothing). Read why in its journal: journalctl -u nfhotel-monitoring-pull --since
                -1h. The same head is not tried again: merge a fix, or fix the host and remove
                /var/lib/nfhotel-monitoring/failed (wiki page Monitoring).

  - name: a change that waits 30 minutes fires MonitoringDeployBehind
    interval: 1m
    input_series:
      - series: >-
          nfhotel_monitoring_deploy_waiting_since_timestamp_seconds{host="nf-monitoring",
          job="scans", instance="scan-exporter:9120"}
        values: "0x40"
      - series: >-
          nfhotel_monitoring_deploy_failed{host="nf-monitoring", job="scans",
          instance="scan-exporter:9120"}
        values: "0x40"
    alert_rule_test:
      - eval_time: 29m
        alertname: MonitoringDeployBehind
        exp_alerts: []
      - eval_time: 31m
        alertname: MonitoringDeployBehind
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-monitoring
              job: scans
              instance: scan-exporter:9120
            exp_annotations:
              summary: "A merged change of the monitoring has waited 30 minutes to be deployed"
              description: >-
                The Ops CI run of the push of the head of main has not passed, or the pull does
                not deploy. Check that run in GitHub Actions and the journal on the monitoring
                host: journalctl -u nfhotel-monitoring-pull --since -1h.

  - name: a change that waits after a failed deploy raises MonitoringDeployFailed, not Behind
    interval: 1m
    input_series:
      - series: >-
          nfhotel_monitoring_deploy_waiting_since_timestamp_seconds{host="nf-monitoring",
          job="scans", instance="scan-exporter:9120"}
        values: "0x40"
      - series: >-
          nfhotel_monitoring_deploy_failed{host="nf-monitoring", job="scans",
          instance="scan-exporter:9120", commit="0123456789ab", stage="ci"}
        values: "1x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: MonitoringDeployBehind
        exp_alerts: []

  - name: a pull that has not read main for an hour fires MonitoringDeployStale
    interval: 2m
    input_series:
      - series: >-
          nfhotel_task_last_success_timestamp_seconds{host="nf-monitoring",
          task="monitoring_pull", job="scans", instance="scan-exporter:9120"}
        values: "0x40"
    alert_rule_test:
      - eval_time: 58m
        alertname: MonitoringDeployStale
        exp_alerts: []
      - eval_time: 62m
        alertname: MonitoringDeployStale
        exp_alerts:
          - exp_labels:
              severity: warning
              host: nf-monitoring
              task: monitoring_pull
              job: scans
              instance: scan-exporter:9120
            exp_annotations:
              summary: "The pull deploy of the monitoring has not read main for an hour"
              description: >-
                nfhotel-monitoring-pull.timer does not run, or the monitoring host cannot reach
                GitHub. Check systemctl status nfhotel-monitoring-pull.timer and the journal of
                the service.

  - name: an exporter without a pull report for 30 minutes fires MonitoringDeployReportMissing
    interval: 1m
    input_series:
      - series: up{job="scans", instance="scan-exporter:9120"}
        values: "1x40"
    alert_rule_test:
      - eval_time: 29m
        alertname: MonitoringDeployReportMissing
        exp_alerts: []
      - eval_time: 31m
        alertname: MonitoringDeployReportMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              task: monitoring_pull
            exp_annotations:
              summary: "The monitoring host reports no pull deploy"
              description: >-
                The timer of the pull is not installed, or its report in
                /var/lib/nfhotel-monitoring/metrics is missing or left out (the log of the scan
                exporter says why). Install it with pull-monitoring.sh --install (wiki page
                Monitoring).

  - name: a pull report raises no MonitoringDeployReportMissing
    interval: 1m
    input_series:
      - series: up{job="scans", instance="scan-exporter:9120"}
        values: "1x40"
      - series: >-
          nfhotel_task_last_success_timestamp_seconds{host="nf-monitoring",
          task="monitoring_pull", job="scans", instance="scan-exporter:9120"}
        values: "0+60x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: MonitoringDeployReportMissing
        exp_alerts: []

  - name: an exporter that is down raises ScanSourceDown alone, not MonitoringDeployReportMissing
    interval: 1m
    input_series:
      - series: up{job="scans", instance="scan-exporter:9120"}
        values: "0x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: MonitoringDeployReportMissing
        exp_alerts: []
