# The forwarder of the mail (MIL-088, ADR-0053 decision 4): plain TCP from the API on the
# internal network nfhotel-mail to the SMTP relay. HAProxy only passes the bytes on: the TLS of
# the mail runs from the API to the relay, so the forwarder sees encrypted bytes only, holds no
# secret, and the API checks the certificate of the relay against Smtp__Host.
global
  log stdout format raw local0 info
  maxconn 20

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  # The API gives up on a mail after 30 seconds; a minute without a byte closes the connection.
  timeout client 60s
  timeout server 60s

# Docker's DNS, which asks the name server of the host for a name outside Docker. The address of
# the relay is found again within 10 seconds, as the database relay of ADR-0034 finds PostgreSQL.
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 10s

frontend mail
  bind :1465
  default_backend relay

# The host and the port come from Smtp__Host and Smtp__Port of nfhotel-api.env, passed on by
# scripts/deploy-services.sh (in the stacks of scripts/lib/stack.sh: the mail catcher). Docker on
# the VM has no IPv6 and HAProxy takes an IPv6 address first, so the relay is reached on IPv4. No
# health check of the relay: it would open a connection to the mail service every few seconds.
backend relay
  server relay "${MAIL_RELAY_HOST}:${MAIL_RELAY_PORT}" resolvers docker resolve-prefer ipv4 init-addr last,libc,none

# The health check of the container asks this listener on the loopback: it answers without a
# connection to the relay, and HAProxy does not log a request of its monitor-uri.
frontend health
  mode http
  bind 127.0.0.1:8405
  monitor-uri /healthz
