# Market analysis service of the notebook-market-analysis repository (MIL-001 there): an API that
# the NFHotel web application calls with the header X-API-Key. It is built from the pinned commit of
# that repository (Dockerfile), joins nfhotel-api (the web application and the API reach it as
# http://market-analysis-api:8000), nfhotel-proxy (nginx publishes it on the internal listener) and
# nfhotel-llm (the Ollama of NFHotel), and publishes no host port. Settings live in market-analysis.env
# (git-ignored); copy market-analysis.env.example first. Start with:
#   docker compose --env-file market-analysis.env up -d --build
name: market-analysis

x-analysis-image: &analysis-image ${MARKET_ANALYSIS_IMAGE:-market-analysis:local}

services:
  market-analysis-api:
    image: *analysis-image
    build:
      context: .
      args:
        MARKET_ANALYSIS_REPO: ${MARKET_ANALYSIS_REPO:-https://github.com/NF-Hotel/notebook-market-analysis.git}
        MARKET_ANALYSIS_REF: ${MARKET_ANALYSIS_REF:-b45b913a3895f93f182b76156b69d2edabf942ed}
      labels:
        org.opencontainers.image.source: https://github.com/NF-Hotel/NFHotel
        org.opencontainers.image.revision: ${NFHOTEL_APP_SHA:-unknown}
    restart: unless-stopped
    env_file: ${MARKET_ANALYSIS_ENV_FILE:-market-analysis.env}
    # Hardening (MIL-023 task 2, CIS-001): its own user, no capability, a read-only root; the results
    # are in the volume, Python and the notebooks write their caches to /tmp and the home folder.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /home/app]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    expose:
      - "8000"
    volumes:
      - results:/data
    networks:
      - proxy
      - llm
      # The web application and the NFHotel API reach this service by its name on this internal network.
      - api

volumes:
  results:

networks:
  proxy:
    name: ${NFHOTEL_PROXY_NETWORK:-nfhotel-proxy}
    external: true
  # Ollama, the model server (deploy/ollama).
  llm:
    name: ${NFHOTEL_LLM_NETWORK:-nfhotel-llm}
    external: true
  # The internal network of the NFHotel API; it has no route out and no host port.
  api:
    name: ${NFHOTEL_API_NETWORK:-nfhotel-api}
    external: true
