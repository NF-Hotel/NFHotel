# Market analysis service of the notebook-market-analysis repository (MIL-001 there): an API that
# the NFHotel web application and the NFHotel API call with the header X-API-Key. It is built from
# the pinned commit of that repository (Dockerfile), joins nfhotel-python (the web application and
# the API reach it as http://market-analysis-api:8000; nginx is not on it, ADR-0039) and
# nfhotel-llm (the Ollama of NFHotel), and publishes no host port. Settings live in
# market-analysis.env (git-ignored); copy market-analysis.env.example first. Start with:
#   docker compose --env-file market-analysis.env up -d --build
name: market-analysis

x-analysis-image: &analysis-image ${MARKET_ANALYSIS_IMAGE:-market-analysis:local}

services:
  market-analysis-api:
    image: *analysis-image
    build:
      context: .
      args:
        MARKET_ANALYSIS_REPO: ${MARKET_ANALYSIS_REPO:-https://github.com/NF-Hotel/notebook-market-analysis.git}
        MARKET_ANALYSIS_REF: ${MARKET_ANALYSIS_REF:-286889844e9608452ca1971c9f6d69fc7fbabbc7}
      labels:
        org.opencontainers.image.source: https://github.com/NF-Hotel/NFHotel
        org.opencontainers.image.revision: ${NFHOTEL_APP_SHA:-unknown}
    restart: unless-stopped
    env_file: ${MARKET_ANALYSIS_ENV_FILE:-market-analysis.env}
    # Hardening (MIL-023 task 2, CIS-001): its own user, no capability, a read-only root; the
    # results are in the volume, Python and the notebooks write their caches to /tmp and the
    # home folder.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /home/app]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    expose:
      - "8000"
    volumes:
      - results:/data
    networks:
      - llm
      # The web application and the NFHotel API reach this service by its name on this
      # internal network; nginx has no route to it (ADR-0039).
      - python

volumes:
  results:

networks:
  # Ollama, the model server (deploy/ollama).
  llm:
    name: ${NFHOTEL_LLM_NETWORK:-nfhotel-llm}
    external: true
  # The internal network of the Python services (ADR-0039): the web application and the NFHotel API
  # are on it, nginx is not; it has no route out and no host port.
  python:
    name: ${NFHOTEL_PYTHON_NETWORK:-nfhotel-python}
    external: true
