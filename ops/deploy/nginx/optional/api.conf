# Optional route to the NFHotel API (ADR-0011 decision 7, MIL-024 task 4). Not loaded:
# this folder is not mounted. To turn the route on after the API is deployed, a reviewed
# change copies this file to deploy/nginx/snippets/locations.d/api.conf; the 443 server
# of templates/default.conf.template includes every *.conf in that folder.
#
# The API is not published to the internet (ADR-0004): only addresses of the tailnet may
# use the route, and the API still requires its token. The upstream is resolved per
# request, so nginx starts and keeps serving the web application when the API is down
# (the route then answers 502).

location /api/ {
  # Tailscale IPv4 (CGNAT range) and IPv6 (ULA) addresses only.
  allow 100.64.0.0/10;
  allow fd7a:115c:a1e0::/48;
  deny all;

  set $api_upstream http://nfhotel-api:8080;
  proxy_pass $api_upstream;
  # Not snippets/proxy.conf: that sets one-hour timeouts and the WebSocket upgrade for the
  # web application, and nginx refuses a directive set twice in one location.
  # The API answers within seconds and holds no WebSocket.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
  proxy_send_timeout 60s;
  client_max_body_size 1m;
}
