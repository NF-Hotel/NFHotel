# Development only (ADR-0015, MIL-029): adds to docker-compose.yml the route that the mobile
# app uses on the development server. The proxy joins the internal network of the API and
# mounts ./dev, whose mobile-api.conf default.conf.template includes. A release deployment
# does not use this file. scripts/dev-up.sh turns it on by putting
# COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml into nginx.env.
services:
  nginx:
    volumes:
      - ./dev:/etc/nginx/dev:ro
    networks:
      - api

networks:
  api:
    name: ${NFHOTEL_API_NETWORK:-nfhotel-api}
    external: true
