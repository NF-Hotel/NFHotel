# The web socket of the pages (MIL-086 decision 7). Blazor Server keeps one connection open on /_blazor for as long
# as a page is open, so this location keeps an idle connection for one hour; every other location waits at most
# 60 seconds (snippets/proxy.conf). Included in the two server blocks of the web application, which set $upstream.
location ^~ /_blazor {
  proxy_pass $upstream;
  include /etc/nginx/snippets/proxy-headers.conf;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}
