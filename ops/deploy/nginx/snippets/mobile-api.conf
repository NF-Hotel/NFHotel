# The routes that the mobile app may call (ADR-0015), included from the public server (public.conf.template,
# MIL-040) and, on the development server, from dev/mobile-api.conf. nginx is a second filter beside the API:
# only the sign-in and the rooms routes pass, with the prefix /mobile-api taken off, and the API address is the
# Docker name on the API network. The server that includes it sets the resolver.
location ~ ^/mobile-api(?<api_path>/api/auth/login|/api/rooms(/.*)?)$ {
  set $api http://nfhotel-api:8080;
  rewrite ^ $api_path break;
  proxy_pass $api;
  include /etc/nginx/snippets/proxy.conf;
  # The mobile app sends no token of the web application; never pass one that a client made up.
  proxy_set_header Authorization "";
}

location /mobile-api/ {
  return 404;
}
