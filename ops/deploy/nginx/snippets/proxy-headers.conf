# The headers of every proxied location of the web application (included from snippets/proxy.conf and
# snippets/blazor.conf). The upgrade of a WebSocket is passed on, so Blazor Server can open its connection.
# X-NFHotel-Client-Address is the one address that nginx saw, which the web application passes to the API for the
# limits of the booking flow and the audit trail; it replaces any value that the caller wrote (MIL-087, ADR-0051).
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-NFHotel-Client-Address $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
