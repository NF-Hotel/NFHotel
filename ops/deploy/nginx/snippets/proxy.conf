# Shared proxy settings for every service location (included from the templates and snippets/mobile-api.conf): the
# headers of snippets/proxy-headers.conf, and a wait of at most 60 seconds for the upstream (MIL-086 decision 7). Only
# the web socket of the pages waits longer, in its own location (snippets/blazor.conf).
include /etc/nginx/snippets/proxy-headers.conf;
proxy_read_timeout 60s;
proxy_send_timeout 60s;
