# Shared proxy settings for every service location (included from the templates).
# Blazor Server and marimo keep a WebSocket open, so the upgrade is passed on and
# idle connections stay open; the analysis API can run for 12 minutes.
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;
proxy_read_timeout 1h;
proxy_send_timeout 1h;
