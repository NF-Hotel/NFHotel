# The database relay of the team (MIL-048, ADR-0034): plain TCP from the tailnet address of
# the VM to PostgreSQL on the internal network nfhotel-db. HAProxy only forwards bytes; the
# login and the rights are checked by PostgreSQL, per person.
global
  log stdout format raw local0 info
  maxconn 50

defaults
  mode tcp
  log global
  option tcplog
  timeout connect 5s
  # DBeaver keeps a connection open while it is idle; an hour without a byte closes it.
  timeout client 1h
  timeout server 1h

# Docker's DNS, so a new address of the database container is found again within 10 seconds.
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 10s

frontend tailnet
  bind :5432
  default_backend postgres

backend postgres
  server postgres postgres:5432 resolvers docker init-addr last,libc,none check inter 10s
