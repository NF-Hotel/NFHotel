# PostgreSQL 16 for the NFHotel web application. Read by Docker Compose. Settings
# live in postgres.env (git-ignored); copy postgres.env.example to postgres.env
# first. Start with:
#   docker compose --env-file postgres.env up -d
# The database is reachable only from the web service: it joins the internal
# network nfhotel-db (created by scripts/deploy.sh with --internal, so it has no
# route out and no published host port). Create it by hand once with:
#   docker network create --internal nfhotel-db
name: nfhotel-postgres

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    env_file: ${POSTGRES_ENV_FILE:-postgres.env}
    # Hardening (MIL-023 task 2, CIS-001). The entrypoint starts as root, fixes the owner and
    # mode of the data folder and drops to the user postgres: these five capabilities are the
    # ones it needs. The data is in the volume; the socket folder and /tmp are tmpfs.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/var/run/postgresql, /tmp]
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks:
      - db

volumes:
  pgdata:

networks:
  db:
    name: ${NFHOTEL_DB_NETWORK:-nfhotel-db}
    external: true
