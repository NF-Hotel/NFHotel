<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Illustration: the suite, with a bed, a sofa, a coffee table and balcony doors onto the street" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <clipPath id="d-door"><rect x="452" y="84" width="156" height="336"/></clipPath>
  <linearGradient id="d-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe7ef"/><stop offset="1" stop-color="#f5e2bd"/></linearGradient>
