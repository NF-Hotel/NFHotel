# Dependabot version updates for NF-Hotel/NFHotel: the application and its operations in
# ops/ (ADR-0016, MIL-022 task 4). Packages, base images and actions are pinned (NuGet
# versions, image digests, action commit SHAs); Dependabot proposes the next pin as a pull
# request, which runs every required check like any other change. A cooldown keeps a new
# release out for a week, so a compromised release has time to be found first. Security
# updates come at once through Dependabot alerts.
# Not here: the Python packages of the benchmark image. ops/deploy/benchmark/requirements.lock
# is generated from the pinned commit of its repository and changes with BENCHMARK_REF.
version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - /
      - /ops/tests/NFHotel.Proxmox.Tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      nuget-minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "Packages:"

  - package-ecosystem: docker
    # The application images, the benchmark and market analysis images, the backup target, and the
    # base of the patched proxy: a new build of nginx:1.29-alpine comes as a change of the FROM line
    # of ops/deploy/nginx/Dockerfile (ADR-0040).
    directories:
      - /
      - /ops/deploy/backup-target
      - /ops/deploy/benchmark
      - /ops/deploy/market-analysis
      - /ops/deploy/nginx
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "Images:"

  - package-ecosystem: docker-compose
    # Every compose folder whose images are pinned by digest, so no pin stays behind (MIL-059). The
    # proxy is not here: its compose file names the image of the release, and its pin is the FROM
    # line of its Dockerfile (the docker entry above, ADR-0040).
    directories:
      - /ops/deploy/alloy
      - /ops/deploy/cloudflared
      - /ops/deploy/monitoring
      - /ops/deploy/ollama
      - /ops/deploy/postgres
      - /ops/deploy/postgres-tailnet
      - /ops/deploy/proxmox
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # These folders pin 13 images (2026-11-08). With the default limit of five open pull requests,
    # the update of 2026-11-04 left Prometheus, Alertmanager and the Blackbox exporter versions
    # behind (MIL-064); the limit is at least the number of images, with room for two more.
    open-pull-requests-limit: 15
    ignore:
      # A new major of PostgreSQL needs a dump and restore (ADR-0008), not a pull.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Images:"

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/release-images
      - /.github/actions/deploy-release
      - /.github/actions/e2e-tests
      - /.github/actions/dast-scan
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Actions:"
