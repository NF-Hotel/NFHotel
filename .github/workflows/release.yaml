# Release: build the NFHotel images once, push them to GHCR and record their
# digests (ADR-0007, MIL-021 task 4). Runs only for a green CI run of a push to
# main in this repository; pull requests never reach this workflow, so untrusted
# code never gets the package token.
name: NF Hotel Release

on:
  workflow_run:
    workflows: [NF Hotel CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and push images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      # Build exactly the commit that CI tested
      - name: Check out the tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push the images
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          bash scripts/build-release-images.sh
          --registry "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          --sha "$HEAD_SHA"
          --output release.json

      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io

      # The manifest is what CD deploys: the commit and one digest per image
      - name: Write the release summary
        run: |
          {
            echo "## Release"
            echo
            echo '```json'
            cat release.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: release.json
          if-no-files-found: error
          retention-days: 90
