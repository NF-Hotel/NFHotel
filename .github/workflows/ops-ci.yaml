# CI of the operations code in ops/ (ADR-0016, formerly the CI of NF-Hotel/DevOps): the
# linters of ops/ and of the workflows and actions, the coverage of the wiki reference pages
# (MIL-049), the script tests, the monitoring configuration (ADR-0020), the runtime check of
# the containers against their profiles (MIL-080), the nginx routes, the networks of the services
# (ADR-0039),
# the Proxmox tests (the live ones skip), the PostgreSQL preparation with the real
# migrations of this commit, the two local development modes (ADR-0035, ADR-0036), and the
# rotation drill of the secrets (ADR-0024). The release build and the throwaway end-to-end
# stack run in release-check.yaml and e2e-dast.yaml, which use the same actions.
#
# Triggers: pull requests to main, pushes to main, and by hand. It runs on every pull
#   request, not only on changes of ops/, because its jobs are required checks.
# Secrets: none; nothing is pushed, and nothing outside the runner changes.
# Verified with actionlint 1.7.7 (ops/tests/lint.sh).
name: NF Hotel Ops CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ops linters
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint, shellcheck, shfmt and yamllint
        run: bash ops/tests/lint.sh
      # The policy of ADR-0037 (MIL-059): pinned actions, read-only tokens at the top, no credential
      # kept in a checkout, no pull_request_target, secrets only on a step, no expression in a
      # script, no download piped to a shell. Its own fixtures are tested first.
      - name: Test the workflow policy check
        run: bash ops/tests/test-workflow-policy.sh --self-test
      - name: Check the workflows against the policy (ADR-0037)
        run: bash ops/tests/test-workflow-policy.sh

  # The reference pages of MIL-049 name every workflow, action, compose service and alert. It
  # reads .github and docs, so it runs on the runner and not in the script-test container,
  # which sees ops/ only.
  wiki-coverage:
    name: Ops wiki coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the wiki names every workflow, container and alert
        run: bash ops/tests/test-wiki-coverage.sh

  script-tests:
    name: Ops script tests (${{ matrix.test }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test:
          - test-deploy-release.sh
          - test-cd-steps.sh
          - test-vm-setup.sh
          - test-scan-gate.sh
          - test-dast-rules.sh
          - test-deploy-services-env.sh
          - test-resolve-model-name.sh
          - test-switch-vm-checkout.sh
          - test-renew-certificate.sh
          - test-backup-target.sh
          - test-backup-settings.sh
          - test-dora-metrics.sh
          - test-report-health.sh
          - test-scan-running-release.sh
          - test-check-log-privacy.sh
          - test-publish-wiki.sh
          - test-create-monitoring-lxc.sh
          - test-write-secret-files.sh
          - test-check-secret-env.sh
          - test-make-migration-script.sh
          - test-remove-desktop.sh
          - test-sudo-log.sh
          - test-check-container-runtime.sh
        # Debian 13: the rrsync of the backup target has -no-overwrite (MIL-066 task 1),
        # remove-desktop.sh is for the VM, which runs Debian 13 (MIL-068), test-sudo-log.sh
        # checks the log of the sudo of the VM (MIL-070), and the runtime check runs on the VM
        # (MIL-080).
        include:
          - test: test-backup-target.sh
            image: debian:13-slim
          - test: test-remove-desktop.sh
            image: debian:13-slim
          - test: test-sudo-log.sh
            image: debian:13-slim
          - test: test-check-container-runtime.sh
            image: debian:13-slim
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Run the test in Debian (12 unless the matrix names another image)
        env:
          TEST: ${{ matrix.test }}
          IMAGE: ${{ matrix.image || 'debian:12-slim' }}
        run: docker run --rm -v "$PWD/ops:/src:ro" "$IMAGE" bash "/src/tests/$TEST"

  host-hardening:
    name: Ops host hardening (Debian 13, MIL-023)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Test the Docker daemon, patching, host settings and evidence scripts
        run: docker run --rm -v "$PWD/ops:/src:ro" debian:13-slim bash /src/tests/test-host-setup.sh
      # NET_ADMIN and SYS_ADMIN let the test load nftables rules and make network namespaces
      # inside its own container; nothing changes on the runner.
      - name: Test the firewall in network namespaces
        run: >-
          docker run --rm --cap-add NET_ADMIN --cap-add SYS_ADMIN --sysctl net.ipv4.ip_forward=1
          -v "$PWD/ops:/src:ro" debian:13-slim bash /src/tests/test-nftables.sh

  monitoring:
    name: Ops monitoring configuration (MIL-023)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check Prometheus, Alertmanager, Loki, blackbox, Alloy and the dashboards
        run: bash ops/tests/check-monitoring.sh
      - name: Lint, type-check and unit-test the scan exporter (MIL-053)
        run: bash ops/tests/test-scan-exporter.sh
      # Root makes the secret files 0600, as the wiki page says, and deploy-monitoring.sh must
      # give each one to the user of its container; only the runner's own containers change.
      - name: Start the stack as the wiki page says, and check it
        run: sudo bash ops/tests/test-monitoring-stack.sh
      # Alloy with its pinned image and hardening, as nf-hotel runs it: user 473, the runner's
      # systemd-journal group, the host mounts read-only.
      - name: Start Alloy as nf-hotel runs it, and check it
        run: sudo bash ops/tests/test-alloy-start.sh
      # Root reads the kernel's view of each container; the containers of the test have no network
      # but one, which is on the runner's own network.
      - name: Check real containers and every compose file against the profiles (MIL-080)
        run: sudo bash ops/tests/test-container-runtime-live.sh

  nginx:
    name: Ops nginx routes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Test the routes with and without the optional API route
        run: bash ops/tests/test-nginx.sh

  service-networks:
    name: Ops service networks (MIL-061)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the service networks with the wiki table; prove the isolation with stand-ins
        run: bash ops/tests/test-service-networks.sh

  benchmark-volume:
    name: Ops benchmark results volume (MIL-045)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Give a volume of another uid to the service; fail the healthcheck without write
        run: bash ops/tests/test-benchmark-volume.sh

  proxmox-tests:
    name: Ops Proxmox tests (live tests skip)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: ops/tests/NFHotel.Proxmox.Tests/global.json
      # Without PVE_HOST the live tests skip; the read-only handler and the client run.
      # ops/scripts/run-proxmox-tests.sh runs all of them against a local Proxmox VE.
      - name: Run the tests
        working-directory: ops/tests/NFHotel.Proxmox.Tests
        run: dotnet test --solution NFHotel.Proxmox.Tests.sln

  database:
    name: Ops PostgreSQL preparation (real migrations)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      - name: Install age
        run: sudo apt-get install -y --no-install-recommends age
      - name: Prepare the migrations and the API image
        run: bash ops/tests/prepare-database-test.sh . ops/tests/output/database
      - name: Test roles, network, migrator, API, backup and restore
        run: >-
          bash ops/tests/test-database.sh ops/tests/output/database/migrations.sql
          nfhotel-api:test

  team-database-roles:
    name: Ops team database roles (MIL-048)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Test the personal roles against PostgreSQL 16
        run: bash ops/tests/test-team-db-users.sh

  # The light development mode of ADR-0035 as a developer runs it: build, start, sign in from the
  # back office and the mobile app, --down keeps the data, --destroy removes it.
  dev-lite:
    name: Ops light development mode (MIL-056)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Start the light mode and check it
        run: bash ops/tests/test-dev-lite.sh

  # The scripts of the light mode with the tools of macOS (BSD, LibreSSL, bash 3.2 as
  # /bin/bash). The runner has no Docker, so the stack itself runs in the job above.
  dev-lite-macos:
    name: Ops light development mode on macOS (MIL-056)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # A developer installs bash 4 or later with Homebrew, as dev-lite.sh says; so does the job.
      - name: Run the portability test with the bash of Homebrew
        run: |
          prefix="$(brew --prefix)"
          "$prefix/bin/bash" -c '((BASH_VERSINFO[0] >= 4))' 2>/dev/null || brew install bash
          export PATH="$prefix/bin:$PATH"
          bash --version | head -1
          bash ops/tests/test-dev-lite-portable.sh

  # F5 in Visual Studio as ADR-0036 prepares it: dev-f5.sh, then the API and the web application
  # with dotnet run and their launch profiles, a sign-in through the API and through the web form,
  # a second run that writes nothing, and --destroy.
  dev-f5:
    name: Ops start from Visual Studio (MIL-057)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json
      # The https launch profile of the web application needs a development certificate.
      - name: Make the development certificate
        run: dotnet dev-certs https
      - name: Prepare F5 and start both projects with their launch profiles
        run: bash ops/tests/test-dev-f5.sh

  secret-rotation:
    name: Ops secret rotation drill (MIL-035)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Rotate each secret on a throwaway stack
        run: bash ops/tests/test-secret-rotation.sh --app-dir .
