# Scan the images that run in production every day, with today's vulnerability database
# (MIL-036 task 1). The images were scanned when they were built (MIL-022); this finds a
# vulnerability that was published after the deploy. A failed gate opens an issue, or adds to
# the open one, and a clean scan closes it.
#
# The release in production is the one that the last successful run of NF Hotel CD deployed:
# its commit is the head of that run, and its release.json is the artifact of NF Hotel Release
# on that commit. The third-party images that no build scans are scanned too (MIL-064 task 6,
# ADR-0040): the pins of the compose files in ops/deploy at the operations commit of that
# release.json (devops_sha), which is checked out next to this one. The steps that find the
# release and scan it are subcommands of ops/scripts/running-image-scan-steps.sh, tested by
# ops/tests/test-scan-running-release.sh.
#
# Triggers: daily, and by hand. By hand, test_image scans one image instead (pinned by
#   digest), to prove the issue path with an image that has known vulnerabilities.
# Secrets: none; the job's GITHUB_TOKEN reads the artifacts and the packages and writes the
#   issue.
# Verified with actionlint 1.7.7 (ops/tests/lint.sh).
name: NF Hotel running image scan

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      test_image:
        description: "Scan this image instead (registry/path@sha256:digest), to test the issue path"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scan:
    name: Scan the release in production
    runs-on: ubuntu-24.04
    # Seventeen images with the third-party ones; ollama alone is 4.8 GB to pull and scan.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ISSUE_TITLE: "Vulnerabilities in the release in production"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The steps of this job are in ops/scripts/running-image-scan-steps.sh, one subcommand each.
      - name: Find the release in production
        id: release
        env:
          TEST_IMAGE: ${{ inputs.test_image }}
        run: bash ops/scripts/running-image-scan-steps.sh find
      # The test image is scanned alone, so the compose files are read only for a release.
      - name: Check out the compose files of the release
        if: steps.release.outputs.devops_sha != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ steps.release.outputs.devops_sha }}
          path: running
          sparse-checkout: ops/deploy
          persist-credentials: false
      - name: Sign in to GHCR to pull the private images
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Scan every image
        id: scan
        env:
          DEVOPS_SHA: ${{ steps.release.outputs.devops_sha }}
        run: bash ops/scripts/running-image-scan-steps.sh scan
      - name: Open, update or close the issue
        env:
          FAILED: ${{ steps.scan.outputs.failed }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          printf '\n\nRun: %s/%s/actions/runs/%s\n' "$SERVER" "$REPO" "$RUN_ID" >>results/summary.md
          open="$(gh issue list --repo "$REPO" --state open --search "in:title \"$ISSUE_TITLE\"" \
            --json number,title --jq "map(select(.title == env.ISSUE_TITLE))[0].number // empty")"
          if [[ "$FAILED" == true ]]; then
            if [[ -n "$open" ]]; then
              gh issue comment "$open" --repo "$REPO" --body-file results/summary.md
            else
              gh issue create --repo "$REPO" --title "$ISSUE_TITLE" --body-file results/summary.md
            fi
            # A finding is reported by the issue, not by a red run: the run is a check of the
            # commit on main, and the CD gate (ADR-0021) refuses a commit with a failed check,
            # so a red run would block the very release that fixes the finding (2026-10-24).
            echo "::warning::vulnerabilities found; see the issue \"$ISSUE_TITLE\""
          elif [[ -n "$open" ]]; then
            gh issue close "$open" --repo "$REPO" --comment "$(cat results/summary.md)"
          fi
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: running-image-scan
          path: results/
          retention-days: 30
      # The runner is thrown away, but the credential does not outlive the step that needs it.
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
