# Navn på workflowet
name: NF Hotel CI

on:
  # Start workflowet manuelt fra Actions
  workflow_dispatch:
  # Byg automatisk ved oprettelse og opdatering af pull requests til main
  pull_request:
    branches: [main]

# Workflowet behøver kun læseadgang til koden
permissions:
  contents: read

jobs:
  build:
    # Kør jobbet på en Linux-maskine hos GitHub
    runs-on: ubuntu-24.04

    steps:
      # Hent projektets kode
      - uses: actions/checkout@v7

      # Installer .NET-versionen fra global.json
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Hent nødvendige NuGet-pakker og byg løsningen
      - run: dotnet build NFHotel.sln
