# CI: build, test and check the code before deployment. Secret: SONAR_TOKEN, the analysis token
# of SonarQube Cloud (ADR-0033); without it the analysis is skipped. It changes nothing outside
# the repository apart from the analysis it sends to SonarQube Cloud.
name: NF Hotel CI

on:
  # Can still be started by hand from Actions
  workflow_dispatch:
  # Check changes before review and merge
  pull_request:
    branches: [main]
  # Also check the whole code after the merge
  push:
    branches: [main]

# The workflow only needs read access
permissions:
  contents: read

# Stop an older run when the same branch or PR gets new changes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Comments are written in English, the Product Owner language (BC-001, MIL-010). A comment in
  # Danish fails the run and the log names the file and the line. Run the same check before a
  # commit with: bash scripts/check-comment-language.sh --staged
  comment-language:
    name: Comments are in English
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The tests of the check come first, so that a broken check cannot pass the code.
      - name: Test the language check
        run: bash scripts/test-check-comment-language.sh

      - name: Check that no comment is in Danish
        run: bash scripts/check-comment-language.sh

  build:
    name: Build, tests and security
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # The analysis token of SonarQube Cloud (ADR-0033). The scanner reads it from the environment;
    # a run without it (a pull request from a fork, or Dependabot) builds and tests and skips the
    # analysis.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      # Fetch the code of the project, with the whole history that the new-code period and the
      # blame data of SonarQube Cloud need
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Use the SDK version of the project
      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      # Scan both direct and indirect NuGet dependencies.
      # Known vulnerabilities and other restore warnings fail the run. Locked mode restores exactly
      # the packages and hashes of the packages.lock.json files (MIL-044).
      - name: Restore and NuGet vulnerability check
        run: >-
          dotnet restore NFHotel.sln --locked-mode
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -p:NuGetAuditLevel=low
          -p:TreatWarningsAsErrors=true

      # Build with the analyzer and code style rules that the project already has
      - name: Build
        run: dotnet build NFHotel.sln --configuration Release --no-restore

      # The SonarScanner for .NET wraps a build and the tests, so SonarQube Cloud analyses the code
      # as it is built and imports the coverage and the test results (ADR-0033). The scanner turns
      # warnings as errors off in the build it wraps, so that build comes after the one above, which
      # keeps them as errors. The settings of the analysis are in SonarQube.Analysis.xml.
      - name: Install the SonarScanner for .NET
        if: ${{ env.SONAR_TOKEN != '' }}
        run: dotnet tool install --global dotnet-sonarscanner --version 11.3.0

      - name: Start the SonarQube Cloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >-
          dotnet sonarscanner begin /k:NF-Hotel_NFHotel
          "/s:${{ github.workspace }}/SonarQube.Analysis.xml"

      - name: Build for the SonarQube Cloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: dotnet build NFHotel.sln --configuration Release --no-restore --no-incremental

      # The integration tests use Testcontainers and start PostgreSQL themselves
      - name: Check Docker for the integration tests
        run: docker info

      # The tests run on Microsoft.Testing.Platform (global.json), which does not
      # know the VSTest collector coverlet.collector. Coverage is therefore measured
      # from the outside with dotnet-coverage, so the test projects need no change.
      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage --version 18.12.0

      # Run all test projects, keep a TRX file per project and measure code coverage. The Visual
      # Studio XML format is the one SonarQube Cloud reads for C#; it does not read Cobertura.
      - name: Tests and coverage
        run: >-
          dotnet-coverage collect
          --settings dotnet-coverage.config.xml
          --output TestResults/coverage.xml
          --output-format xml
          "dotnet test NFHotel.sln --configuration Release --no-build
          --results-directory TestResults --report-xunit-trx"

      # The same coverage as Cobertura for the artifact, which other tools read
      - name: Coverage as Cobertura
        if: ${{ always() && hashFiles('TestResults/coverage.xml') != '' }}
        run: >-
          dotnet-coverage merge TestResults/coverage.xml
          --output TestResults/coverage.cobertura.xml
          --output-format cobertura

      # Send the analysis; the quality gate is reported by the SonarQube Cloud app as its own check
      - name: End the SonarQube Cloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: dotnet sonarscanner end

      # Keep the reports also when tests fail
      - name: Keep test results and coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NFHotel.sln --locked-mode

      # Check the formatting against .editorconfig without changing files.
      # Code style and analyzers are also handled by the build settings of the project.
      - name: Check formatting
        run: dotnet format whitespace NFHotel.sln --verify-no-changes --no-restore

  container:
    name: Docker build
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Check that the Dockerfile of the project can package the web application.
      # The image is built only locally on the runner; it is not published.
      - name: Build the Docker image
        run: docker build --tag nfhotel:ci .
