# Release check: on every pull request to main, build the four images through the
# local release-images action (ADR-0016), without pushing. It shows that a change of the
# application or of ops/ still releases: the images build, pass the Trivy gate and carry
# the labels of this commit.
#
# Trigger: pull requests to main. Secrets: none; a read-only token; nothing is pushed and
# nothing outside the repository changes.
# Verified with actionlint 1.7.7.
name: NF Hotel Release check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Release build (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read the commit under test
        id: app
        run: echo "sha=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Build the images through the release-images action
        id: release
        uses: ./.github/actions/release-images
        with:
          app-path: .
          app-sha: ${{ steps.app.outputs.sha }}
          push: "false"

      - name: Show the commit the action ran at
        env:
          DEVOPS_SHA: ${{ steps.release.outputs.devops-sha }}
        run: echo "release-images ran at the operations commit $DEVOPS_SHA"
