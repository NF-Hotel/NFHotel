# CD: deploy a release to the Proxmox VM after an approval (ADR-0007, ADR-0016). The steps
# are the local deploy-release action (.github/actions/deploy-release, with the scripts of
# ops/), read from the commit of the release. This workflow keeps the trigger, the
# permissions, the environment and the concurrency, which a composite action cannot set.
#
# Triggers: a successful NF Hotel Release run of main in this repository
#   (workflow_run), or by hand with the run ID of an earlier release (a redeploy or a
#   rollback). A manual run is a dry run unless the input apply is true.
# Approval: the job runs in the environment production, whose required reviewers approve
#   it before it starts; no credential exists before that.
# Access: the action joins the tailnet as an ephemeral node tagged tag:ci through GitHub
#   OIDC (the claims name this repository and production; no stored Tailscale secret)
#   and runs one command on the VM over Tailscale SSH as the user deploy (no stored key).
# Settings (environment variables of production, not secrets): TS_OIDC_CLIENT_ID,
#   TS_OIDC_AUDIENCE, NFHOTEL_VM_HOST.
# Changes outside the repository: the services on the VM.
# Verified with actionlint 1.7.7.
name: NF Hotel CD

on:
  workflow_run:
    workflows: [NF Hotel Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Run ID of the NF Hotel Release run to deploy
        required: true
        type: string
      apply:
        description: Deploy for real (false prints what would be deployed)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    # A run from a fork never reaches the deploy
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'workflow_run' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: read
      packages: read

    steps:
      # The action is read from the commit of the release (main for a manual run), which
      # holds no secret and gets no token to push.
      - name: Check out the action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Deploy the release
        uses: ./.github/actions/deploy-release
        with:
          release-run-id: ${{ github.event.workflow_run.id || inputs.release_run_id }}
          apply: ${{ github.event_name == 'workflow_run' || inputs.apply }}
          vm-host: ${{ vars.NFHOTEL_VM_HOST }}
          ts-oidc-client-id: ${{ vars.TS_OIDC_CLIENT_ID }}
          ts-oidc-audience: ${{ vars.TS_OIDC_AUDIENCE }}
          github-token: ${{ github.token }}
