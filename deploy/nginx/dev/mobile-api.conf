# Development only (ADR-0015): the routes that the mobile app may call, on the development server. Included from
# the TLS server block of default.conf.template; the folder is mounted only by docker-compose.dev.yml, so a
# release deployment has no such route. nginx is a second filter beside the API: only the sign-in and the rooms
# routes pass, with the prefix /mobile-api taken off, and the API address is the Docker name on the API network.
location ~ ^/mobile-api(?<api_path>/api/auth/login|/api/rooms(/.*)?)$ {
  set $api http://nfhotel-api:8080;
  rewrite ^ $api_path break;
  proxy_pass $api;
  include /etc/nginx/snippets/proxy.conf;
  # The mobile app sends no token of the web application; never pass one that a client made up.
  proxy_set_header Authorization "";
}

location /mobile-api/ {
  return 404;
}
