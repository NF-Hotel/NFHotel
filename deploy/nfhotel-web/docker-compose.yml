# NFHotel web application, reachable only through the nginx proxy (MIL-002
# task 4). Read by Docker Compose. Settings live in nfhotel-web.env
# (git-ignored); copy nfhotel-web.env.example to nfhotel-web.env first.
# Start with:
#   docker compose --env-file nfhotel-web.env up -d --build
# The image comes from the repository root Dockerfile (already on main).
# No host port is published: the proxy reaches the service by name on the
# shared network (create it once: docker network create nfhotel-proxy).
# PostgreSQL is deploy/postgres; the web service reaches it by name (postgres) on
# the internal network nfhotel-db: docker network create --internal nfhotel-db.
name: nfhotel-web

services:
  nfhotel-web:
    image: nfhotel-web:local
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ${NFHOTEL_WEB_ENV_FILE:-nfhotel-web.env}
    # The connection string is built here from postgres.env, so the database
    # password lives in one file only. scripts/deploy-services.sh exports the
    # POSTGRES_* values; when running compose by hand, export them first.
    # Use no ; or quote in the password (openssl rand -hex 24 is safe).
    environment:
      ConnectionStrings__HotelDatabase: Host=postgres;Port=5432;Database=${POSTGRES_DB:-nfhotel};Username=${POSTGRES_USER:-nfhotel};Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD, it comes from deploy/postgres/postgres.env}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks:
      - proxy
      - db

networks:
  proxy:
    name: ${NFHOTEL_PROXY_NETWORK:-nfhotel-proxy}
    external: true
  # Internal network shared with PostgreSQL only (no route out, no host port).
  db:
    name: ${NFHOTEL_DB_NETWORK:-nfhotel-db}
    external: true
