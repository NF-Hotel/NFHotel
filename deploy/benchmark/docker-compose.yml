# The benchmark service of the notebook-benchmark repository (ADR-0004, MIL-019, MIL-020): an API that the
# web application calls to start a run and that delivers the result to the NFHotel API. It is built from
# the pinned commit of that repository, joins nfhotel-api (the web application reaches it as
# http://benchmark:8000) and nfhotel-llm (the Ollama of NFHotel), and publishes no port.
# Start it with scripts/deploy-services.sh, which passes the service token of the API as API_TOKEN, so the
# token is written in nfhotel-api.env only.
name: benchmark

services:
  benchmark:
    image: benchmark:local
    build:
      # Change BENCHMARK_REF to upgrade. Submodules are not fetched: the framework submodule is private and not part of the image.
      context: ${BENCHMARK_REPO:-https://github.com/NF-Hotel/notebook-benchmark.git}?submodules=false#${BENCHMARK_REF:-239143865b6293ce6f5f6496509c8fd0110c59c2}
    restart: unless-stopped
    env_file: ${BENCHMARK_ENV_FILE:-benchmark.env}
    environment:
      NFBENCH_WEB_TOKEN: ${API_TOKEN:?set it, from Api__Token in nfhotel-api.env}
    expose:
      - "8000"
    volumes:
      - results:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - llm
      - api

volumes:
  results:

networks:
  llm:
    name: ${NFHOTEL_LLM_NETWORK:-nfhotel-llm}
    external: true
  api:
    name: ${NFHOTEL_API_NETWORK:-nfhotel-api}
    external: true
